<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1" />
        <title>프리셋 편집기</title>
        <link
            rel="stylesheet"
            crossorigin
            href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
        <style>
            :root {
                --bg: #f5f4f1;
                --panel: #ffffff;
                --text: #1f1f1d;
                --muted: #6b6a66;
                --faint: #9a988f;
                --line: #e3e1db;
                --accent: #638164;
                --accent-soft: #f6f6f6;
                --accent-text: #ffffff;
                --hover: #f2f0ec;
                --sel: #eaf1fd;
                --warn: #9a6200;
                --warn-soft: #fff4dc;
                --ok: #2f7a4b;
                --chip: #eeece7;
                --code-bg: #f4f2ee;
                --danger: #b3261e;
            }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) {
                    --bg: #151514;
                    --panel: #1e1e1c;
                    --text: #ecebe8;
                    --muted: #a3a19b;
                    --faint: #75736d;
                    --line: #33322e;
                    --accent: #5b755e;
                    --accent-soft: #3a3a3a;
                    --accent-text: #0c1424;
                    --hover: #262522;
                    --sel: #1d2a40;
                    --warn: #e8b85a;
                    --warn-soft: #2f2715;
                    --ok: #73c492;
                    --chip: #2b2a27;
                    --code-bg: #252422;
                    --danger: #f08a82;
                }
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
            }
            body {
                background: var(--bg);
                color: var(--text);
                font:
                    14px/1.5 "Pretendard Variable",
                    Pretendard,
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    "Malgun Gothic",
                    sans-serif;
            }
            button,
            input,
            select {
                font: inherit;
                color: inherit;
            }
            button {
                border: 1px solid var(--line);
                background: var(--panel);
                border-radius: 7px;
                padding: 5px 11px;
                cursor: pointer;
                white-space: nowrap;
            }
            button:hover {
                background: var(--hover);
            }
            button.primary {
                background: var(--accent);
                border-color: var(--accent);
                color: var(--accent-text);
                font-weight: 600;
            }
            button.ghost {
                border-color: transparent;
                background: transparent;
                color: var(--muted);
                padding: 3px 7px;
            }
            button.ghost:hover {
                background: var(--hover);
                color: var(--text);
            }
            button.icon {
                padding: 2px 7px;
                font-size: 13px;
            }
            input[type="text"],
            select {
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 7px;
                padding: 6px 9px;
                width: 100%;
                min-width: 0;
            }
            input[type="text"]:focus,
            select:focus {
                outline: 2px solid var(--accent-soft);
                border-color: var(--accent);
            }
            .hidden {
                display: none !important;
            }

            /* top bar */
            .top {
                position: sticky;
                top: 0;
                z-index: 5;
                background: var(--panel);
                border-bottom: 1px solid var(--line);
            }
            .top-inner {
                max-width: 1200px;
                margin: 0 auto;
                padding: 10px 16px;
                display: flex;
                gap: 8px;
                align-items: center;
            }
            .brand {
                font-weight: 700;
                white-space: nowrap;
                margin-right: 6px;
            }
            .top #presetName {
                flex: 0 1 280px;
                border-color: transparent;
                background: transparent;
                font-weight: 600;
            }
            .top #presetName:hover {
                border-color: var(--line);
            }
            .top #presetName:focus {
                background: var(--panel);
            }
            .top-sp {
                flex: 1;
            }
            .filemenu {
                position: relative;
            }
            .filebtn {
                display: inline-flex;
                align-items: center;
                gap: 7px;
                color: var(--text);
                font-weight: 500;
                max-width: 240px;
            }
            .filebtn #fileName {
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .filebtn[aria-expanded="true"] {
                background: var(--hover);
            }
            .dcaret {
                width: 0;
                height: 0;
                flex: none;
                border-left: 4px solid transparent;
                border-right: 4px solid transparent;
                border-top: 5px solid var(--muted);
            }
            .menu {
                position: absolute;
                top: calc(100% + 4px);
                left: 0;
                z-index: 40;
                min-width: 200px;
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 10px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
                padding: 5px;
                display: flex;
                flex-direction: column;
            }
            .menu button {
                border: 0;
                background: none;
                text-align: left;
                padding: 7px 10px;
                border-radius: 6px;
            }
            .menu button:hover {
                background: var(--hover);
            }
            .menu .danger {
                color: var(--danger);
            }
            .menu hr {
                border: 0;
                border-top: 1px solid var(--line);
                margin: 4px 2px;
                width: auto;
            }
            .filebtn:not(.loaded) {
                border-color: var(--line);
                background: var(--panel);
            }
            .filebtn:not(.loaded) .dcaret {
                display: none;
            }
            /* list: on/off as a dot, row actions only on hover */
            .dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                border: 1.5px solid var(--faint);
                flex: none;
                display: inline-block;
            }
            .dot.on {
                background: var(--accent);
                border-color: var(--accent);
            }
            .legend {
                display: inline-flex;
                gap: 5px;
                align-items: center;
                color: var(--faint);
                font-size: 12px;
                white-space: nowrap;
            }
            .legend .dot:not(:first-child) {
                margin-left: 6px;
            }
            .row .rowact {
                opacity: 0;
            }
            .row:hover .rowact,
            .row.open .rowact,
            .row .rowact:focus-visible {
                opacity: 1;
            }
            @media (hover: none) {
                .row .rowact {
                    opacity: 0.6;
                }
            }
            .row.sel {
                box-shadow: inset 3px 0 0 var(--accent);
            }
            /* editor: option box doubles as the picker preview */
            .opts-head {
                display: flex;
                align-items: baseline;
                gap: 8px;
                padding: 8px 10px 6px;
                border-bottom: 1px solid var(--line);
                background: var(--code-bg);
                border-radius: 10px 10px 0 0;
            }
            .opts-head b {
                flex: 1;
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .opts-head b:empty::before {
                content: "(제목 없음)";
                color: var(--faint);
                font-weight: 400;
            }
            .opt .optact {
                opacity: 0;
            }
            .opt:hover .optact,
            .opt .optact:focus-visible,
            .opt .optact.on {
                opacity: 1;
            }
            @media (hover: none) {
                .opt .optact {
                    opacity: 0.6;
                }
            }
            .adv-t {
                border: 0;
                background: none;
                padding: 2px 0;
                color: var(--muted);
                display: inline-flex;
                gap: 8px;
                align-items: center;
                align-self: flex-start;
                white-space: normal;
                text-align: left;
            }
            .adv-t:hover {
                background: none;
                color: var(--text);
            }
            .adv-t::before {
                content: "";
                flex: none;
                border-top: 4px solid transparent;
                border-bottom: 4px solid transparent;
                border-left: 5px solid currentColor;
                transition: transform 0.15s;
            }
            .adv-t[aria-expanded="true"]::before {
                transform: rotate(90deg);
            }
            .adv-t .hint {
                font-size: 12px;
            }
            .adv {
                display: flex;
                flex-direction: column;
                gap: 12px;
                padding: 12px;
                background: var(--bg);
                border-radius: 10px;
            }
            .modes {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }
            .modes button {
                text-align: left;
                white-space: normal;
                display: flex;
                flex-direction: column;
                gap: 1px;
                padding: 7px 10px;
                border-radius: 8px;
            }
            .modes button.on {
                border-color: var(--accent);
                box-shadow: inset 0 0 0 1px var(--accent);
            }
            .modes button span {
                font-size: 12px;
                color: var(--muted);
                line-height: 1.4;
            }
            @media (max-width: 520px) {
                .modes {
                    grid-template-columns: 1fr;
                }
            }
            /* check tab: one list for everything to look at before export */
            .checks {
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 12px;
                margin-bottom: 12px;
                overflow: hidden;
            }
            .checks-h {
                display: flex;
                gap: 8px;
                align-items: center;
                flex-wrap: wrap;
                padding: 10px 14px;
                border-bottom: 1px solid var(--line);
            }
            .checks-h b {
                margin-right: auto;
            }
            .ck {
                display: grid;
                grid-template-columns: 4px minmax(0, 1fr);
                border-top: 1px solid var(--line);
            }
            .checks-h + .ck {
                border-top: 0;
            }
            .ck::before {
                content: "";
                background: var(--sev);
            }
            .ck > div {
                padding: 8px 12px;
                min-width: 0;
            }
            .ck .sv {
                font-size: 12px;
                font-weight: 600;
                color: var(--sev);
                margin-right: 6px;
            }
            .ck .where {
                display: block;
                color: var(--muted);
                font-size: 12px;
                margin-top: 1px;
            }
            .k-manual {
                --sev: var(--danger);
            }
            .k-approx {
                --sev: var(--warn);
            }
            .k-info {
                --sev: var(--line);
            }
            .k-info .sv {
                color: var(--muted);
            }
            .checks-ok {
                padding: 12px 14px;
                color: var(--ok);
            }
            .tabs {
                max-width: 1200px;
                margin: 0 auto;
                padding: 0 16px;
                display: flex;
                gap: 18px;
            }
            .tab {
                border: 0;
                border-bottom: 2px solid transparent;
                border-radius: 0;
                background: none;
                padding: 6px 0 8px;
                color: var(--muted);
            }
            .tab:hover {
                background: none;
                color: var(--text);
            }
            .tab.on {
                color: var(--text);
                border-bottom-color: var(--text);
                font-weight: 600;
            }
            .badge {
                display: inline-block;
                min-width: 18px;
                padding: 0 6px;
                border-radius: 999px;
                font-size: 12px;
                background: var(--chip);
                color: var(--muted);
                text-align: center;
            }
            .badge.warn {
                background: var(--warn-soft);
                color: var(--warn);
            }
            main {
                max-width: 1200px;
                margin: 0 auto;
                padding: 14px 16px 60px;
            }

            /* empty state */
            .drop {
                margin: 40px auto;
                max-width: 560px;
                border: 2px dashed var(--line);
                border-radius: 14px;
                padding: 48px 20px;
                text-align: center;
                background: var(--panel);
                cursor: pointer;
            }
            .drop.over {
                border-color: var(--accent);
                background: var(--sel);
            }
            .drop b {
                display: block;
                font-size: 17px;
                margin-bottom: 6px;
            }
            .drop span {
                color: var(--muted);
            }
            .err {
                color: var(--danger);
                margin-top: 10px;
            }

            /* toggle → variable */
            .cols {
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
                gap: 14px;
                align-items: start;
            }
            .right {
                display: flex;
                flex-direction: column;
                gap: 14px;
                min-width: 0;
            }
            .chip.blank {
                background: transparent;
                border: 1px dashed var(--line);
                color: var(--faint);
            }
            .sheet-head,
            .lfab,
            .backdrop,
            .only-narrow {
                display: none;
            }
            @media (max-width: 820px) {
                .cols {
                    grid-template-columns: minmax(0, 1fr);
                }
                /* phones: the source toggle list is a bottom sheet opened from a floating button */
                #listPane {
                    display: none;
                }
                body.list-open {
                    overflow: hidden;
                }
                body.list-open #listPane {
                    display: flex;
                    flex-direction: column;
                    position: fixed;
                    left: 0;
                    right: 0;
                    bottom: 0;
                    height: 85vh;
                    height: 85dvh;
                    z-index: 20;
                    border-radius: 16px 16px 0 0;
                    border-bottom: 0;
                    box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.18);
                }
                body.list-open #listPane .list {
                    flex: 1;
                    max-height: none;
                    min-height: 0;
                    overscroll-behavior: contain;
                    padding-bottom: env(safe-area-inset-bottom);
                }
                body.list-open .backdrop {
                    display: block;
                    position: fixed;
                    inset: 0;
                    z-index: 19;
                    background: rgba(0, 0, 0, 0.35);
                }
                .sheet-head {
                    display: flex;
                    align-items: center;
                    gap: 8px;
                    padding: 14px 12px 8px;
                    position: relative;
                    border-bottom: 1px solid var(--line);
                }
                .sheet-head::before {
                    content: "";
                    position: absolute;
                    top: 5px;
                    left: 50%;
                    width: 40px;
                    height: 4px;
                    margin-left: -20px;
                    border-radius: 2px;
                    background: var(--line);
                }
                .sheet-head b {
                    margin-right: auto;
                }
                .lfab {
                    display: block;
                    position: fixed;
                    left: 12px;
                    right: 12px;
                    bottom: calc(12px + env(safe-area-inset-bottom));
                    z-index: 15;
                    padding: 13px;
                    border: 0;
                    border-radius: 12px;
                    background: var(--accent);
                    color: var(--accent-text);
                    font-weight: 600;
                    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
                }
                .lfab:hover {
                    background: var(--accent);
                }
                body.list-open .lfab {
                    display: none;
                }
                .only-narrow {
                    display: inline;
                }
                .only-wide {
                    display: none;
                }
                main {
                    padding: 12px 12px 90px;
                }
                .top-inner {
                    flex-wrap: wrap;
                    padding: 8px 12px;
                }
                .top-inner #presetName {
                    order: 10;
                    flex-basis: 100%;
                }
                .top-inner .top-sp {
                    display: none;
                }
                .top-inner .filemenu {
                    margin-right: auto;
                }
                .tabs {
                    padding: 0 12px;
                    overflow-x: auto;
                    white-space: nowrap;
                    scrollbar-width: none;
                }
            }
            .only-touch {
                display: none;
            }
            @media (hover: none) {
                .only-touch {
                    display: inline;
                }
                .only-mouse {
                    display: none;
                }
            }

            /* touch: bigger hit areas, 16px inputs so iOS doesn't zoom on focus */
            @media (pointer: coarse) {
                input[type="text"],
                select {
                    font-size: 16px;
                }
                .row {
                    padding: 10px 12px;
                    flex-wrap: wrap;
                    row-gap: 4px;
                }
                .row .nm {
                    flex-basis: 55%;
                }
                .row input[type="checkbox"],
                .opt input[type="checkbox"],
                .opt input[type="radio"] {
                    width: 20px;
                    height: 20px;
                }
                button.icon {
                    min-width: 34px;
                    min-height: 34px;
                }
                .toolbar button.ghost {
                    padding: 7px 10px;
                }
                .seg button {
                    padding: 8px 12px;
                }
                .opt {
                    flex-wrap: wrap;
                }
                .opt input[type="text"] {
                    flex: 1 1 70px;
                }
                .opt button.icon {
                    min-width: 30px;
                    padding: 2px 4px;
                }
                .opt .src {
                    display: none;
                }
                .grp {
                    padding: 10px 12px;
                }
            }
            .pane {
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 12px;
            }
            .pane-head {
                padding: 10px 12px;
                border-bottom: 1px solid var(--line);
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .toolbar {
                display: flex;
                gap: 4px;
                align-items: center;
                flex-wrap: wrap;
            }
            .toolbar .count {
                margin-left: auto;
                color: var(--muted);
                font-size: 13px;
            }
            .search {
                display: flex;
                gap: 6px;
            }
            .search select {
                width: auto;
            }
            .list {
                max-height: calc(100vh - 230px);
                min-height: 200px;
                overflow: auto;
                user-select: none;
            }
            .grp {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 6px 12px;
                background: var(--code-bg);
                font-size: 12px;
                color: var(--muted);
                font-weight: 600;
                cursor: pointer;
                border-bottom: 1px solid var(--line);
                position: sticky;
                top: 0;
            }
            .row {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 6px 12px;
                border-bottom: 1px solid var(--line);
                cursor: pointer;
            }
            .row:hover {
                background: var(--hover);
            }
            .row.sel {
                background: var(--sel);
            }
            .row.off {
                cursor: default;
                color: var(--faint);
            }
            .row.off:hover {
                background: none;
            }
            .row.gone .nm {
                text-decoration: line-through;
                color: var(--faint);
            }
            .row .nm {
                flex: 1;
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .chip {
                font-size: 11px;
                background: var(--chip);
                color: var(--muted);
                border-radius: 999px;
                padding: 1px 7px;
                white-space: nowrap;
            }
            .chip.on {
                color: var(--ok);
            }
            .chip.var {
                background: var(--accent-soft);
                color: var(--accent);
            }
            .hint {
                font-size: 12px;
                color: var(--faint);
            }

            /* editor */
            .editor {
                padding: 14px;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }
            .ed-title {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                flex-wrap: wrap;
            }
            .ed-title b {
                font-size: 15px;
            }
            .seg {
                display: inline-flex;
                border: 1px solid var(--line);
                border-radius: 8px;
                overflow: hidden;
            }
            .seg button {
                border: 0;
                border-radius: 0;
                padding: 5px 11px;
                background: var(--panel);
                color: var(--muted);
            }
            .seg button + button {
                border-left: 1px solid var(--line);
            }
            .seg button.on {
                background: var(--accent-soft);
                color: var(--accent);
                font-weight: 600;
            }
            .grid2 {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            @media (max-width: 520px) {
                .grid2 {
                    grid-template-columns: 1fr;
                }
            }
            .affix {
                display: flex;
            }
            .affix [data-prefix] {
                width: 76px;
                flex: none;
                border-radius: 7px 0 0 7px;
                border-right: 0;
                background: var(--code-bg);
            }
            .affix [data-field] {
                border-radius: 0 7px 7px 0;
            }
            [data-final]:empty {
                display: none;
            }
            .fld > span {
                display: block;
                font-size: 12px;
                color: var(--muted);
                margin-bottom: 3px;
            }
            .opts {
                border: 1px solid var(--line);
                border-radius: 10px;
            }
            .opt {
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 5px 8px;
                border-bottom: 1px solid var(--line);
            }
            .opt:last-child {
                border-bottom: 0;
            }
            .opt input[type="text"] {
                padding: 4px 8px;
            }
            .opt .src {
                font-size: 11px;
                color: var(--faint);
                white-space: nowrap;
                max-width: 30%;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .opt-preview {
                margin: 0 8px 8px;
            }
            .ed-foot {
                display: flex;
                justify-content: flex-end;
                gap: 6px;
                align-items: center;
            }
            .ed-foot .err {
                margin: 0 auto 0 0;
            }
            .empty {
                padding: 40px 20px;
                text-align: center;
                color: var(--muted);
            }
            .vars-head {
                padding: 10px 14px 6px;
                font-size: 12px;
                color: var(--muted);
                font-weight: 600;
            }
            .var {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 8px 14px;
                border-top: 1px solid var(--line);
            }
            .var.editing {
                background: var(--sel);
            }
            .var .info {
                flex: 1;
                min-width: 0;
            }
            .var .sub {
                font-size: 12px;
                color: var(--muted);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            code,
            .mono {
                font-family: ui-monospace, Consolas, monospace;
                font-size: 12.5px;
            }
            pre {
                white-space: pre-wrap;
                word-break: break-word;
                background: var(--code-bg);
                border-radius: 8px;
                padding: 9px 11px;
                margin: 0;
                font:
                    12.5px/1.5 ui-monospace,
                    Consolas,
                    monospace;
                max-height: 260px;
                overflow: auto;
            }

            /* macro tab */
            .stats {

        <header class="top">

        <script id="core">
            (function (root) {
                "use strict";

                const ID_ALPHABET = "useandom-26T198340PX75pxJACKVERYMINDBUSHWOLF_GQZbfghjklqvwyzrict";
                function newId() {
                    const bytes = new Uint8Array(21);
                    root.crypto.getRandomValues(bytes);
                    let id = "";
                    for (const b of bytes) id += ID_ALPHABET[b & 63];
                    return id;
                }

                function makeReport() {
                    const map = new Map();
                    return {
                        add(kind, message, where) {
                            const key = kind + "|" + message;
                            if (!map.has(key)) map.set(key, {kind, message, where: new Set()});
                            if (where) map.get(key).where.add(where);
                        },
                        list() {
                            return [...map.values()].map((w) => ({kind: w.kind, message: w.message, where: [...w.where]}));
                        },
                    };
                }

                function lex(text) {
                    const tokens = [];
                    let i = 0,
                        textStart = 0;
                    while (i < text.length) {
                        if (text.startsWith("{{", i)) {
                            let j = i + 2,
                                depth = 1;
                            while (j < text.length && depth > 0) {
                                if (text.startsWith("{{", j)) {
                                    depth++;
                                    j += 2;
                                } else if (text.startsWith("}}", j)) {
                                    depth--;
                                    j += 2;
                                } else j++;
                            }
                            if (depth !== 0) break;
                            if (i > textStart) tokens.push({t: "text", v: text.slice(textStart, i)});
                            tokens.push({t: "macro", raw: text.slice(i, j), inner: text.slice(i + 2, j - 2)});
                            i = j;
                            textStart = j;
                        } else i++;
                    }
                    if (textStart < text.length) tokens.push({t: "text", v: text.slice(textStart)});
                    return tokens;
                }

                function splitTop(str, sep) {
                    const parts = [];
                    let depth = 0,
                        start = 0;
                    for (let i = 0; i < str.length; i++) {
                        if (str.startsWith("{{", i)) {
                            depth++;
                            i++;
                            continue;
                        }
                        if (str.startsWith("}}", i)) {
                            depth--;
                            i++;
                            continue;
                        }
                        if (depth === 0 && str.startsWith(sep, i)) {
                            parts.push(str.slice(start, i));
                            start = i + sep.length;
                            i += sep.length - 1;
                        }
                    }
                    parts.push(str.slice(start));
                    return parts;
                }

                const VAR_IDENT = /^[a-zA-Z](?:[\w-]*\w)?/;
                const SHORTHAND_OPS = ["++", "--", "??=", "??", "||=", "||", "-=", "==", "!=", ">=", ">", "<=", "<", "+=", "="];

                function parseHead(inner) {
                    let i = 0;
                    const s = inner;
                    const ws = () => {
                        while (i < s.length && /\s/.test(s[i])) i++;
                    };
                    ws();
                    if (s.startsWith("//", i)) return {kind: "comment"};
                    const flags = [];
                    while (i < s.length && "!?~>#/".includes(s[i])) {
                        if (s[i] === "/" && s[i + 1] === "/") break;
                        flags.push(s[i]);
                        i++;
                        ws();
                    }
                    if (s.startsWith("//", i)) return {kind: "comment"};
                    if (s[i] === "." || s[i] === "$") {
                        const m = s.slice(i + 1).match(VAR_IDENT);
                        if (m) {
                            const after = s.slice(i + 1 + m[0].length).trim();
                            let op = null,
                                value = "";
                            if (after) {
                                op = SHORTHAND_OPS.find((o) => after.startsWith(o));
                                if (!op) return null;
                                value = after.slice(op.length).trim();
                            }
                            return {kind: "shorthand", flags, global: s[i] === "$", varName: m[0], op, value};
                        }
                    }
                    const m = s.slice(i).match(/^[a-zA-Z_][\w-]*/);
                    if (!m) return null;
                    const name = m[0];
                    const rest = s.slice(i + name.length);
                    let args;
                    if (/^\s*$/.test(rest)) args = [];
                    else if (rest.startsWith("::")) args = splitTop(rest.slice(2), "::");
                    else if (rest.startsWith(":")) args = [rest.slice(1)];
                    else if (/^\s/.test(rest)) {
                        const r = rest.trim();
                        args = r.startsWith("::") ? splitTop(r.slice(2), "::") : [r];
                    } else return null;
                    return {kind: "macro", flags, closing: flags.includes("/"), name, lname: name.toLowerCase(), args: args.map((a) => a.trim()), rest};
                }

                const RENAME = {
                    user: "user",
                    char: "char",
                    group: "group",
                    input: "input",
                    model: "model",
                    description: "description",
                    chardescription: "description",
                    personality: "personality",
                    charpersonality: "personality",
                    scenario: "scenario",
                    charscenario: "scenario",
                    persona: "personaDescription",
                    mesexamples: "example",
                    mesexamplesraw: "example",
                    charprompt: "charSysInfo",
                    charinstruction: "charPostHistory",
                    lastgenerationtype: "lastGenerationType",
                    idleduration: "idle_duration",
                    idle_duration: "idle_duration",
                    date: "date",
                    time: "time",
                    weekday: "weekday",
                    isotime: "isotime",
                    noop: "noop",
                    trim: "trim",
                };
                const APPROX_RENAME = {
                    groupnotmuted: ["group", "{{groupNotMuted}} → {{group}} (음소거 여부는 구분하지 않습니다)"],
                    charifnotgroup: ["char", "{{charIfNotGroup}} → {{char}} (그룹 채팅에서도 캐릭터 이름이 들어갑니다)"],
                    isodate: ["date", "{{isodate}} → {{date}}"],
                    lastusermessage: ["input", "{{lastUserMessage}} → {{input}} (마리나라의 '가장 최근 사용자 메시지'입니다. 거의 같습니다)"],
                };
                const UNSUPPORTED = new Set(["lastmessage", "lastmessageid", "lastcharmessage", "firstincludedmessageid", "firstdisplayedmessageid", "lastswipeid", "currentswipeid", "allchatrange", "maxprompt", "maxprompttokens", "maxcontext", "maxcontexttokens", "maxresponse", "maxresponsetokens", "notchar", "chardepthprompt", "charcreatornotes", "creatornotes", "charfirstmessage", "greeting", "charversion", "original", "ismobile", "systemprompt", "hasextension", "datetimeformat", "timediff", "setvarkey", "getvarkey", "setvarindex", "getvarindex", "setglobalvarkey", "getglobalvarkey", "setglobalvarindex", "getglobalvarindex", "format", "formula", "lastchatmessage", "mesexamplesraw_", "instructinput", "instructoutput", "instructsystem", "instructsystemprompt", "instructstoryprefix", "instructstorystring", "chatstart", "examplesseparator", "chatseparator", "exampleseparator", "systemprefix", "systemsuffix"]);
                const VAR_SAME = new Set(["getvar", "setvar", "addvar", "incvar", "decvar"]);
                const VAR_GLOBAL = {getglobalvar: "getvar", setglobalvar: "setvar", addglobalvar: "addvar", incglobalvar: "incvar", decglobalvar: "decvar"};
                const HASVAR = new Set(["hasvar", "varexists", "hasglobalvar", "globalvarexists"]);
                const DELVAR = new Set(["deletevar", "flushvar", "deleteglobalvar", "flushglobalvar"]);
                const TH_GETVAR = /^get_(?:chat|message|preset|global|character|script)_variable$/;
                const NATIVE_BLOCKS = new Set(["uppercase", "lowercase"]);
                const SCOPED_CONTENT = new Set([...VAR_SAME, ...Object.keys(VAR_GLOBAL), "random", "pick", "roll", "banned", "outlet", "reverse", "trim"]);
                const PASSTHROUGH = new Set(["random", "roll", "outlet", "trimstart", "trimend", "addnumvar", "datetime", "timezone", "include", "lorebooksize", "agent", "newline", "uppercase", "lowercase", "banned"]);

                const mac = (name, ...args) => "{{" + [name, ...args].join("::") + "}}";
                function quote(v) {
                    const toks = lex(v.trim());
                    if (toks.length === 1 && toks[0].t === "macro") return v.trim();
                    return '"' + v.replace(/\\/g, "\\\\").replace(/"/g, '\\"').replace(/\n/g, "\\n") + '"';
                }
                const ifElse = (cond, a, b) => "{{#if " + cond + "}}" + a + (b !== undefined && b !== null ? "{{else}}" + b : "") + "{{/if}}";

                function fixLegacyText(v) {
                    return v
                        .replace(/<USER>/g, "{{user}}")
                        .replace(/<BOT>|<CHAR>|<CHARIFNOTGROUP>/g, "{{char}}")
                        .replace(/<GROUP>/g, "{{group}}");
                }

                function makeConverter(report, reservedText = "", renames = new Map(), preferred = new Map()) {
                    let where = "";
                    let renameSeq = renames.size;

                    const inSource = (s) => new RegExp(`::\\s*${escRe(s)}\\s*(?:::|\\}\\})|var:${escRe(s)}(?![\\w.-])|["'\`]${escRe(s)}["'\`]`).test(reservedText);
                    function varName(name) {
                        const n = name.trim();
                        if (!n || /^[\w.-]+$/.test(n) || n.includes("{{")) return n;
                        if (!renames.has(n)) {
                            let safe;
                            const taken = new Set(renames.values());
                            const free = (s) => !taken.has(s) && !inSource(s) && !RESERVED_NAMES.has(s.toLowerCase());
                            const want = String(preferred.get(n) ?? "").trim();
                            if (/^[A-Za-z_][\w.-]*$/.test(want)) {
                                safe = want;
                                for (let k = 2; !free(safe); k++) safe = `${want}_${k}`;
                            } else {
                                do safe = "cv_" + String(++renameSeq).padStart(3, "0");
                                while (reservedText.includes(safe) || taken.has(safe));
                            }
                            renames.set(n, safe);
                        }
                        report.add("info", "영문이 아닌 변수 이름은 마리나라가 읽지 못하므로 영문 이름으로 바꿨습니다. 매크로 변환 탭의 대응표를 확인하세요.");
                        return renames.get(n);
                    }

                    function convertText(text) {
                        const tokens = lex(text);
                        const pairs = pairBlocks(tokens);
                        return convertTokens(tokens, 0, tokens.length, pairs);
                    }

                    function pairBlocks(tokens) {
                        const pairs = new Map();
                        const stack = [];
                        tokens.forEach((tok, k) => {
                            if (tok.t !== "macro") return;
                            const h = parseHead(tok.inner);
                            tok.head = h;
                            if (!h || h.kind !== "macro") return;
                            if (h.closing) {
                                for (let s = stack.length - 1; s >= 0; s--) {
                                    if (stack[s].lname === h.lname) {
                                        pairs.set(stack[s].k, k);
                                        stack.length = s;
                                        return;
                                    }
                                }
                                return;
                            }
                            if (h.lname !== "else") stack.push({lname: h.lname, k});
                        });
                        return pairs;
                    }

                    function convertTokens(tokens, from, to, pairs) {
                        let out = "";
                        for (let k = from; k < to; k++) {
                            const tok = tokens[k];
                            if (tok.t === "text") {
                                out += fixLegacyText(tok.v);
                                continue;
                            }
                            if (pairs.has(k)) {
                                const close = pairs.get(k);
                                out += convertScoped(tokens, k, close, pairs);
                                k = close;
                                continue;
                            }
                            out += convertMacro(tok, null);
                        }
                        return out;
                    }

                    function convertScoped(tokens, open, close, pairs) {
                        const h = tokens[open].head;
                        if (h.lname === "if") return convertIf(h, tokens, open + 1, close, pairs);
                        if (NATIVE_BLOCKS.has(h.lname)) return "{{" + h.lname + "}}" + convertTokens(tokens, open + 1, close, pairs) + "{{/" + h.lname + "}}";
                        let content = convertTokens(tokens, open + 1, close, pairs);
                        if (!SCOPED_CONTENT.has(h.lname)) return convertMacro(tokens[open], null) + content + tokens[close].raw;
                        if (!h.flags.includes("#")) content = content.trim();
                        if (h.lname === "trim") return content;
                        return convertMacro(tokens[open], content);
                    }

                    function convertIf(h, tokens, from, to, pairs) {
                        let elseAt = -1;
                        for (let k = from; k < to; k++) {
                            if (pairs.has(k)) {
                                k = pairs.get(k);
                                continue;
                            }
                            const t = tokens[k];
                            if (t.t === "macro" && t.head && t.head.kind === "macro" && !t.head.closing && t.head.lname === "else") {
                                elseAt = k;
                                break;
                            }
                        }
                        const a = convertTokens(tokens, from, elseAt >= 0 ? elseAt : to, pairs);
                        const b = elseAt >= 0 ? convertTokens(tokens, elseAt + 1, to, pairs) : undefined;
                        const rawCond = h.rest.replace(/^\s*::?/, "").trim();
                        const {cond, inverted} = convertCondition(rawCond);
                        if (!inverted) return ifElse(cond, a, b);
                        return ifElse(cond, b === undefined ? "" : b, a);
                    }

                    function convertCondition(raw) {
                        let c = raw.trim();
                        let inverted = false;
                        if (c.startsWith("!")) {
                            inverted = true;
                            c = c.replace(/^!\s*/, "");
                        }
                        let m = c.match(/^([.$])([a-zA-Z](?:[\w-]*\w)?)$/);
                        if (m) {
                            if (m[1] === "$") globalWarn();
                            return {cond: "var:" + m[2], inverted};
                        }
                        m = c.match(/^\{\{\s*([.$])([a-zA-Z](?:[\w-]*\w)?)\s*(==|!=|>=|<=|>|<)\s*([\s\S]*?)\s*\}\}$/);
                        if (m) {
                            if (m[1] === "$") globalWarn();
                            return {cond: "var:" + m[2] + " " + m[3] + " " + quote(convertText(m[4])), inverted};
                        }
                        m = c.match(/^\{\{\s*get(global)?var\s*::\s*([^:{}]+?)\s*\}\}$/i);
                        if (m) {
                            if (m[1]) globalWarn();
                            return {cond: "var:" + varName(m[2]), inverted};
                        }
                        if (/^[a-zA-Z_][\w-]*$/.test(c)) {
                            const l = c.toLowerCase();
                            if (RENAME[l] || APPROX_RENAME[l] || UNSUPPORTED.has(l)) return {cond: convertText("{{" + c + "}}"), inverted};
                            report.add("info", `조건 '${c}'은(는) 실리태번 매크로가 아니라서 글자 그대로("${c}") 비교하도록 바꿨습니다.`, where);
                            return {cond: quote(c), inverted};
                        }
                        if (c.includes("{{")) return {cond: convertText(c), inverted};
                        return {cond: c ? quote(c) : '""', inverted};
                    }

                    function globalWarn() {
                        report.add("approx", "전역 변수($변수, getglobalvar 등)를 일반 변수로 바꿨습니다. 마리나라에는 전역 변수가 없어서 값이 채팅마다 따로 저장됩니다.", where);
                    }

                    function convertShorthand(h) {
                        const n = h.varName;
                        if (h.global) globalWarn();
                        const v = convertText(h.value || "");
                        switch (h.op) {
                            case null:
                                return mac("getvar", n);
                            case "=":
                                return mac("setvar", n, v);
                            case "++":
                                return mac("incvar", n);
                            case "--":
                                return mac("decvar", n);
                            case "+=":
                                return mac("addvar", n, v);
                            case "-=":
                                if (/^-?\d+(\.\d+)?$/.test(v.trim())) {
                                    const num = v.trim();
                                    return mac("addnumvar", n, num.startsWith("-") ? num.slice(1) : "-" + num);
                                }
                                report.add("manual", `{{.${n} -= ...}}의 값이 숫자가 아니라서 바꾸지 못했습니다. 직접 고쳐야 합니다.`, where);
                                return "{{." + n + " -= " + v + "}}";
                            case "||":
                            case "??":
                                if (h.op === "??") report.add("approx", "?? (값이 없을 때 기본값)는 '값이 비었거나 거짓일 때'로 바꿨습니다. 거의 같지만 값이 0이나 false일 때만 다릅니다.", where);
                                return ifElse("var:" + n, mac("getvar", n), v);
                            case "||=":
                            case "??=":
                                if (h.op === "??=") report.add("approx", "??= 는 '값이 비었거나 거짓일 때 저장'으로 바꿨습니다.", where);
                                return ifElse("var:" + n, mac("getvar", n), mac("setvar", n, v) + v);
                            default:
                                report.add("approx", "변수 비교({{.x == 값}})는 마리나라 조건문으로 바꿨습니다. 마리나라는 대소문자를 구분하지 않고, 숫자는 숫자로 비교합니다.", where);
                                return ifElse("var:" + n + " " + h.op + " " + quote(v), "true", "false");
                        }
                    }

                    function convertMacro(tok, scoped) {
                        const h = tok.head !== undefined ? tok.head : parseHead(tok.inner);
                        if (!h) return tok.raw;
                        if (h.kind === "comment") return tok.raw;
                        if (h.kind === "shorthand") return convertShorthand(h);
                        if (h.closing) return tok.raw;
                        if (h.flags.includes(">")) report.add("manual", `{{>${h.name} ...}} 처럼 필터(>) 표시가 붙은 매크로는 표시만 떼고 바꿨습니다. 필터 동작은 확인이 필요합니다.`, where);
                        const l = h.lname;
                        const args = h.args.map(convertText);
                        if (scoped !== null) args.push(scoped);

                        if (l === "if") {
                            if (args.length < 2) return tok.raw;
                            const {cond, inverted} = convertCondition(h.args[0]);
                            return inverted ? ifElse(cond, "", args[1]) : ifElse(cond, args[1]);
                        }
                        if (l === "else") return "{{else}}";
                        if (RENAME[l]) {
                            if (args.length) {
                                report.add("manual", `{{${h.name}}}에 붙은 인자는 마리나라에서 쓸 수 없어서 원문 그대로 두었습니다.`, where);
                                return tok.raw;
                            }
                            return "{{" + RENAME[l] + "}}";
                        }
                        if (APPROX_RENAME[l]) {
                            report.add("approx", APPROX_RENAME[l][1], where);
                            return "{{" + APPROX_RENAME[l][0] + "}}";
                        }
                        if (TH_GETVAR.test(l) && args.length) {
                            report.add("approx", "JS-Slash-Runner 변수 매크로(get_chat_variable 등)를 {{getvar}}로 바꿨습니다. 변수 범위(채팅·프리셋·전역)는 구분하지 않습니다.", where);
                            return mac("getvar", varName(args[0]));
                        }
                        if ((VAR_SAME.has(l) || VAR_GLOBAL[l] || HASVAR.has(l) || DELVAR.has(l)) && args.length) args[0] = varName(args[0]);
                        if (VAR_SAME.has(l)) return mac(l, ...args);
                        if (VAR_GLOBAL[l]) {
                            globalWarn();
                            return mac(VAR_GLOBAL[l], ...args);
                        }
                        if (HASVAR.has(l)) {
                            if (l.includes("global")) globalWarn();
                            report.add("approx", "hasvar(변수가 있는지)는 '값이 비어 있지 않은지'로 바꿨습니다.", where);
                            return ifElse("var:" + (args[0] || ""), "true", "false");
                        }
                        if (DELVAR.has(l)) {
                            if (l.includes("global")) globalWarn();
                            report.add("approx", "deletevar(변수 지우기)는 '값을 비우기'로 바꿨습니다.", where);
                            return mac("setvar", args[0] || "", "");
                        }
                        switch (l) {
                            case "newline": {
                                const n = parseInt(args[0] || "1", 10);
                                return "{{newline}}".repeat(n > 0 ? n : 1);
                            }
                            case "space": {
                                const n = parseInt(args[0] || "1", 10);
                                return " ".repeat(n > 0 ? n : 1);
                            }
                            case "roll": {
                                if (!args[0]) return tok.raw;
                                const a = args[0].replace(/\s+/g, "");
                                return "{{roll:" + (/^\d+$/.test(a) ? "1d" + a : a) + "}}";
                            }
                            case "random":
                            case "pick": {
                                if (l === "pick") report.add("approx", "{{pick}}을 {{random}}으로 바꿨습니다. pick은 항상 같은 값을 골랐지만, random은 메시지마다 새로 고릅니다.", where);

                                const legacy = !h.rest.trimStart().startsWith("::");
                                const opts = legacy && args.length === 1 ? splitTop(args[0], ",").map((x) => x.trim()) : args;
                                if (!opts.length) return "{{random}}";
                                return mac("random", ...opts);
                            }
                            case "banned":
                                return '{{banned "' + (args[0] || "").replace(/"/g, '\\"') + '"}}';
                            case "outlet":
                                return mac("outlet", ...args);
                            case "reverse":
                                if (args[0] !== undefined && !args[0].includes("{{")) return [...args[0]].reverse().join("");
                                report.add("manual", "{{reverse}} 안에 매크로가 있어서 바꾸지 못했습니다.", where);
                                return tok.raw;
                        }
                        if (UNSUPPORTED.has(l)) {
                            report.add("manual", `{{${h.name}}}은(는) 마리나라에 같은 기능이 없어서 원문 그대로 두었습니다.`, where);
                            return tok.raw;
                        }
                        if (PASSTHROUGH.has(l)) return tok.raw;
                        return tok.raw;
                    }

                    return {
                        convert(text, label) {
                            where = label || "";
                            return convertText(text || "");
                        },
                        renames,
                    };
                }

                const MARKER_DISPLAY_NAMES = {character: "Character Info", world_info_before: "World Info (before)", world_info_after: "World Info (after)", persona: "Persona", chat_history: "Chat History", dialogue_examples: "Chat Examples"};
                function mapMarkerConfig(identifier, legacy) {
                    if (legacy && (identifier === "worldInfoBefore" || identifier === "worldInfoAfter")) return {type: "lorebook"};
                    switch (identifier) {
                        case "chatHistory":
                            return {type: "chat_history"};
                        case "charDescription":
                        case "charPersonality":
                        case "scenario":
                        case "enhanceDefinitions":
                            return {type: "character"};
                        case "personaDescription":
                            return {type: "persona"};
                        case "worldInfoBefore":
                            return {type: "world_info_before"};
                        case "worldInfoAfter":
                            return {type: "world_info_after"};
                        case "dialogueExamples":
                            return {type: "dialogue_examples"};
                        default:
                            return null;
                    }
                }

                function guessPresetName(raw, fileName) {
                    if (typeof raw.name === "string" && raw.name.trim()) return raw.name.trim();
                    if (fileName) return fileName.replace(/\.json$/i, "");
                    return "Preset";
                }

                function parsePreset(raw, fileName, opts = {}) {
                    if (!raw || !Array.isArray(raw.prompts)) throw new Error("실리태번 프롬프트 프리셋이 아닙니다 (prompts 목록이 없습니다).");
                    const report = makeReport();
                    const conv = makeConverter(report, JSON.stringify(raw), new Map(), opts.varNames);
                    const orderDef = (raw.prompt_order || []).find((o) => o.character_id === 100001) || (raw.prompt_order || [])[0];
                    const orderMap = new Map(((orderDef && orderDef.order) || []).map((o, i) => [o.identifier, {index: i, enabled: o.enabled}]));
                    const chatHistoryIndex = orderMap.has("chatHistory") ? orderMap.get("chatHistory").index : Number.MAX_SAFE_INTEGER;
