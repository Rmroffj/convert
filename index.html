                        let s = j;
                        while (isP(T[s - 1], ".") || isP(T[s - 1], "?.")) s -= 2;
                        if (cmp(T[s - 1]) && lit(T[s - 2])) return {field: T[j].v, lit: String(T[s - 2].v)};
                    }
                    return null;
                }

                function switchField(T, c) {
                    let d = 0,
                        j = c - 1;
                    for (; j >= 0; j--) {
                        const t = T[j];
                        if (t.t !== "p") continue;
                        if (CLOSERS.includes(t.v)) d++;
                        else if (OPENERS.includes(t.v)) {
                            if (!d) break;
                            d--;
                        }
                    }
                    if (!isP(T[j], "{") || !isP(T[j - 1], ")")) return null;
                    let k = j - 2;
                    d = 0;
                    for (; k >= 0; k--) {
                        const t = T[k];
                        if (t.t !== "p") continue;
                        if (CLOSERS.includes(t.v)) d++;
                        else if (OPENERS.includes(t.v)) {
                            if (!d) break;
                            d--;
                        } else if (!d && t.v === ",") break;
                    }
                    const last = T[j - 2];
                    return last && last.t === "id" ? last.v : null;
                }

                function branchOf(T, k) {
                    let d = 0,
                        stmt = false;
                    for (let j = k - 1; j >= 0 && j > k - 6000; j--) {
                        const t = T[j];
                        if (t.t === "id" && t.v === "case" && !d) {
                            const field = switchField(T, j);
                            return field && T[j + 1] && (T[j + 1].t === "str" || T[j + 1].t === "num") ? {field, lit: String(T[j + 1].v)} : null;
                        }
                        if (t.t !== "p") continue;
                        if (CLOSERS.includes(t.v)) {
                            d++;
                            continue;
                        }
                        if (OPENERS.includes(t.v)) {
                            if (d) {
                                d--;
                                continue;
                            }
                            if (t.v === "{") return null;
                            continue;
                        }
                        if (d) continue;
                        if (t.v === ";") {
                            stmt = true;
                            continue;
                        }
                        if (stmt) continue;
                        if (t.v === "?") return condBefore(T, j);
                        if (t.v === ":") {
                            if (T[j - 2] && T[j - 2].t === "id" && T[j - 2].v === "case") continue;
                            let need = 1,
                                dd = 0;
                            for (let m = j - 1; m >= 0 && m > j - 6000; m--) {
                                const u = T[m];
                                if (u.t !== "p") continue;
                                if (CLOSERS.includes(u.v)) {
                                    dd++;
                                    continue;
                                }
                                if (OPENERS.includes(u.v)) {
                                    if (dd) {
                                        dd--;
                                        continue;
                                    }
                                    return null;
                                }
                                if (dd) continue;
                                if (u.v === ":") need++;
                                else if (u.v === "?" && --need === 0) {
                                    const c = condBefore(T, m);
                                    return c ? {field: c.field, lit: null} : null;
                                } else if (u.v === ";") return null;
                            }
                            return null;
                        }
                    }
                    return null;
                }

                function rhsEnd(T, k) {
                    let d = 0,
                        q = 0;
                    for (; k < T.length; k++) {
                        const t = T[k];
                        if (t.t !== "p") continue;
                        if (OPENERS.includes(t.v)) d++;
                        else if (CLOSERS.includes(t.v)) {
                            if (!d) return k;
                            d--;
                        } else if (!d) {
                            if (t.v === "?") q++;
                            else if (t.v === ":") {
                                if (!q) return k;
                                q--;
                            } else if (t.v === "," || t.v === ";") return k;
                        }
                    }
                    return k;
                }

                function analyzeScripts(raw, sections, conv, report) {
                    const {scripts, vars: presetVars} = readTavernScripts(raw);
                    if (!scripts.length) return [];
                    const back = new Map([...conv.renames].map(([from, to]) => [to, from]));
                    const promptVars = new Map(),
                        promptSet = new Set();
                    for (const s of sections) {
                        if (s.isMarker) continue;
                        for (const re of [/\{\{\s*getvar\s*::\s*([\w.-]+)\s*\}\}/gi, /(?<![\w])var:([\w.-]+)/g]) {
                            let m;
                            while ((m = re.exec(s.content))) promptVars.set(m[1], back.get(m[1]) || m[1]);
                        }
                        const set = /\{\{\s*(?:setvar|addvar|incvar|decvar|addnumvar)\s*::\s*([\w.-]+)/gi;
                        let m;
                        while ((m = set.exec(s.content))) promptSet.add(m[1]);
                    }
                    const toggles = sections.filter((s) => !s.isMarker);
                    const byIdent = new Map(toggles.map((s) => [s.identifier, s]));
                    const claimed = new Set();

                    const result = scripts.map((sc) => {
                        const code = sc.content;
                        const where = "스크립트: " + sc.name;
                        const T = lexJs(code).toks;
                        const literals = codeLiterals(T);
                        const flags = SCRIPT_FLAGS.filter(([re]) => re.test(code)).map(([, label]) => label);
                        const suggestions = [];
                        const text = (t) => conv.convert(repairMacros(t, report, where), where);
                        const silent = makeConverter(makeReport(), "", conv.renames);
                        const quiet = (t) => silent.convert(repairMacros(t, makeReport(), ""), "");

                        const maps = labelMaps(literals);
                        const labelsFor = (keys) => {
                            const fits = maps.filter((m) => keys.every((k) => m.byValue.has(k)));
                            fits.sort((a, b) => (a.byValue.size === keys.length ? 0 : 1) - (b.byValue.size === keys.length ? 0 : 1) || a.byValue.size - b.byValue.size);
                            return fits[0] || null;
                        };

                        const tables = stringTables(literals);
                        for (const tb of tables) tb.matchable = tb.entries.map(([key, raw]) => [key, quiet(raw).trim()]);
                        const allText = toggles.map((s) => s.content).join("\n\u0000\n");
                        const choiceTables = tables.filter((tb) => tb.matchable.filter(([, t]) => t.length >= 30 && allText.includes(t)).length === 1);
                        for (const s of toggles) {
                            if (!s.content.trim()) continue;
                            const hits = [];
                            for (const tb of choiceTables) {
                                let best = null;
                                for (const [key, t] of tb.matchable) {
                                    const at = t.length >= 30 ? s.content.indexOf(t) : -1;
                                    if (at >= 0 && (!best || t.length > best.find.length)) best = {key, find: t, at};
                                }
                                if (best) hits.push({tb, ...best});
                            }
                            hits.sort((a, b) => b.find.length - a.find.length);
                            const taken = [];
                            for (const h of hits) {
                                if (taken.some((x) => h.at < x.at + x.find.length && x.at < h.at + h.find.length)) continue;
                                taken.push(h);
                                const whole = h.find === s.content.trim();
                                const last =
                                    h.tb.path
                                        .split(/[.[\]]/)
                                        .filter(Boolean)
                                        .pop() || h.tb.path;
                                const lm = labelsFor(h.tb.entries.map(([key]) => key));
                                const options = h.tb.entries.map(([key]) => ({key, label: (lm && lm.byValue.get(key)) || key}));
                                const topic = lm && lm.parentKey && !/^[\w$]+$/.test(lm.parentKey) ? lm.parentKey : "";
                                suggestions.push({
                                    kind: "slot",
                                    key: `s:${s.identifier}:${h.tb.path}`,
                                    identifier: s.identifier,
                                    sectionId: s.id,
                                    question: topic || (whole ? s.name : `${s.name} · ${last}`),
                                    varName: last,
                                    options,
                                    def: h.key,
                                    find: h.find,
                                    texts: Object.fromEntries(h.tb.entries.map(([key, raw]) => [key, text(raw).trim()])),
                                });
                            }
                        }
                        const slotted = new Set(suggestions.map((sg) => sg.identifier));

                        const tableKeys = new Map();
                        for (const tb of stringTables(literals, 0, 1)) for (const [key, raw] of tb.entries) if (!tableKeys.has(key)) tableKeys.set(key, raw);
                        const resolveTpl = (tok) => {
                            let out = tok.parts[0];
                            for (let i = 0; i < tok.exprs.length; i++) {
                                const path = tok.exprs[i].split(".").map((x) => x.trim());
                                if (path.length < 2 || !path.every((x) => /^[\p{L}\p{N}_$]+$/u.test(x))) return null;
                                const v = dataLookup(sc.data, path.slice(1));
                                if (v === undefined) return null;
                                out += v + tok.parts[i + 1];
                            }
                            return out;
                        };

                        const rhsValues = (a, b) => {
                            const vals = [];
                            const add = (t, key) => {
                                if (t !== null && t !== undefined && !vals.some((x) => x.text === t)) vals.push({text: t, key});
                            };
                            if (b - a === 1 && T[a].t === "str") return [{text: T[a].v, key: null}];
                            if (b - a === 1 && T[a].t === "tpl") {
                                const r = resolveTpl(T[a]);
                                return r === null ? [] : [{text: r, key: null}];
                            }
                            for (let j = a; j < b; j++) {
                                let key = null;
                                if ((isP(T[j], ".") || isP(T[j], "?.")) && T[j + 1] && T[j + 1].t === "id") key = T[j + 1].v;
                                else if (isP(T[j], "[") && T[j + 1] && T[j + 1].t === "str" && isP(T[j + 2], "]")) key = T[j + 1].v;
                                if (key && tableKeys.has(key)) add(dataLookup(sc.data, [key]) ?? tableKeys.get(key), key);
                            }
                            if (!vals.length) for (let j = a; j < b; j++) if ((T[j].t === "str" && isP(T[j - 1], "?")) || (T[j].t === "str" && isP(T[j - 1], ":"))) add(T[j].v, null);
                            return vals;
                        };
                        const sites = [];
                        for (const [convName, origName] of promptVars) {
                            if (promptSet.has(convName)) continue;
                            const names = new Set([convName, origName]);
                            for (let k = 1; k + 2 < T.length; k++) {
                                let rhs = -1,
                                    base = -1;
                                if ((isP(T[k], ".") || isP(T[k], "?.")) && T[k + 1].t === "id" && names.has(T[k + 1].v) && isP(T[k + 2], "=")) {
                                    rhs = k + 3;
                                    base = k - 1;
                                } else if (isP(T[k], "[") && T[k + 1].t === "str" && names.has(T[k + 1].v) && isP(T[k + 2], "]") && isP(T[k + 3], "=")) {
                                    rhs = k + 4;
                                    base = k - 1;
                                } else if ((T[k].t === "id" || T[k].t === "str") && names.has(T[k].v) && isP(T[k + 1], ":") && (isP(T[k - 1], "{") || isP(T[k - 1], ","))) {
                                    let d = 0,
                                        j = k - 1;
                                    for (; j >= 0 && j > k - 400; j--) {
                                        const t = T[j];
                                        if (t.t !== "p") continue;
                                        if (CLOSERS.includes(t.v)) d++;
                                        else if (OPENERS.includes(t.v)) {
                                            if (!d) {
                                                if (t.v === "(") break;
                                            } else d--;
                                        }
                                    }
                                    if (isP(T[j], "(") && T[j - 1] && T[j - 1].t === "id" && VAR_API.has(T[j - 1].v)) {
                                        rhs = k + 2;
                                        base = k;
                                    }
                                } else if (T[k].t === "str" && isP(T[k - 1], ",") && isP(T[k + 1], ",") && names.has(T[k].v.split(".").pop())) {
                                    let d = 0,
                                        j = k - 2;
                                    for (; j >= 0 && j > k - 400; j--) {
                                        const t = T[j];
                                        if (t.t !== "p") continue;
                                        if (CLOSERS.includes(t.v)) d++;
                                        else if (OPENERS.includes(t.v)) {
                                            if (!d) break;
                                            d--;
                                        } else if (!d && t.v === ",") {
                                            j = -1;
                                            break;
                                        }
                                    }
                                    if (j > 2 && isP(T[j], "(") && T[j - 1].t === "id" && T[j - 1].v === "set" && isP(T[j - 2], ".") && T[j - 3].t === "id" && (T[j - 3].v === "_" || T[j - 3].v === "lodash")) {
                                        rhs = k + 2;
                                        base = j - 3;
                                    }
                                }
                                if (rhs < 0) continue;
                                const values = rhsValues(rhs, rhsEnd(T, rhs));
                                if (!values.length) continue;
                                sites.push({conv: convName, orig: origName, branch: branchOf(T, base), values, at: k});
                            }
                        }

                        const slashNames = new Map();
                        for (const [convName, origName] of promptVars) if (!promptSet.has(convName)) for (const n of [convName, origName]) slashNames.set(n, [convName, origName]);
                        const SLASH_SET = /\/set(?:global)?var((?:\s+\w+=(?:"(?:[^"\\]|\\.)*"|[^\s|]+))+)[ \t]*([^|\n]*?)[ \t]*(?=\||\n|$)/g;

                        const SLASH_CHAT = /\/(?:send|sendas|sys|setinput|trigger|gen|genraw|input|buttons|continue|impersonate)\b/;
                        const slashTexts = T.map((tok) =>
                            tok.t === "str" ? [tok.v]
                            : tok.t === "tpl" ? tok.parts
                            : [],
                        );
                        const runtimeVars = new Set();
                        for (const parts of slashTexts) {
                            const whole = parts.join("");
                            for (const m of whole.matchAll(/\/flushvar\s+(?:key=)?"?([^\s|"]+)/g)) runtimeVars.add(m[1]);
                            for (const m of whole.matchAll(SLASH_SET)) {
                                const key = /\bkey=("(?:[^"\\]|\\.)*"|[^\s|]+)/.exec(m[1])?.[1].replace(/^"([\s\S]*)"$/, "$1");
                                if (key && (SLASH_CHAT.test(whole) || /\{\{\s*(?:input|pipe)\s*\}\}/i.test(m[2]))) runtimeVars.add(key);
                            }
                        }
                        T.forEach((tok, k) => {
                            const parts = slashTexts[k];
                            parts.forEach((part, p) => {
                                for (const m of String(part).matchAll(SLASH_SET)) {
                                    if (m.index + m[0].length === part.length && p < parts.length - 1) continue;
                                    const args = Object.fromEntries([...m[1].matchAll(/(\w+)=("(?:[^"\\]|\\.)*"|[^\s|]+)/g)].map(([, a, v]) => [a, v.replace(/^"([\s\S]*)"$/, "$1")]));
                                    const value = m[2].replace(/^"([\s\S]*)"$/, "$1");
                                    if (!slashNames.has(args.key) || runtimeVars.has(args.key) || args.index !== undefined || !value) continue;
                                    const [convName, origName] = slashNames.get(args.key);
                                    sites.push({conv: convName, orig: origName, branch: branchOf(T, k), values: [{text: value, key: null}], at: k});
                                }
                            });
                        });
                        const fields = new Map();
                        const loose = new Map();
                        for (const st of sites) {
                            claimed.add(st.conv);
                            if (!st.branch) {
                                loose.set(st.conv, [...(loose.get(st.conv) || []), ...st.values]);
                                continue;
                            }
                            const f = fields.get(st.branch.field) || {branches: new Map(), vars: new Set()};
                            fields.set(st.branch.field, f);
                            const bk = st.branch.lit === null ? "#else" : st.branch.lit;
                            if (!f.branches.has(bk)) f.branches.set(bk, new Map());
                            if (!f.branches.get(bk).has(st.conv)) f.branches.get(bk).set(st.conv, st.values[0]);
                            f.vars.add(st.conv);
                        }
                        for (const [field, f] of fields) {
                            const lits = [...f.branches.keys()].filter((b) => b !== "#else");

                            let elseLabel = "그 외";
                            if (f.branches.has("#else")) {
                                for (const v of f.branches.get("#else").values()) {
                                    if (!v.key) continue;
                                    for (const lit of lits) {
                                        const other = [...f.branches.get(lit).values()].find((x) => x.key && x.key.endsWith(lit));
                                        if (other) {
                                            const prefix = other.key.slice(0, -lit.length);
                                            if (v.key.startsWith(prefix)) elseLabel = v.key.slice(prefix.length);
                                        }
                                    }
                                }
                            }
                            const options = [...f.branches.keys()].map((b) => ({key: b, label: b === "#else" ? elseLabel : b}));
                            const saved = dataLookup(sc.data, [field]);
                            const def =
                                options.find((o) => o.key === saved) ? saved
                                : f.branches.has("#else") ? "#else"
                                : options[0].key;
                            const targets = [...f.vars].map((v) => ({
                                type: "read",
                                sourceName: v,
                                origName: promptVars.get(v),
                                texts: Object.fromEntries(
                                    options.map((o) => {
                                        const x = f.branches.get(o.key).get(v);
                                        return [o.key, x ? text(x.text) : ""];
                                    }),
                                ),
                            }));
                            suggestions.push({kind: "setting", key: `f:${field}`, question: field, varName: field, field, options, def, targets});
                        }
                        for (const [v, vals] of loose) {
                            const uniq = vals.filter((x, i) => vals.findIndex((y) => y.text === x.text) === i);
                            const options = uniq.map((x, i) => ({key: "o" + i, label: x.key || (x.text.length > 24 ? x.text.slice(0, 24) + "…" : x.text) || "(빈 값)"}));
                            const init = presetVars[promptVars.get(v)] ?? presetVars[v];
                            const di = uniq.findIndex((x) => init !== undefined && x.text === String(init));
                            suggestions.push({
                                kind: "setting",
                                key: `v:${v}`,
                                question: promptVars.get(v),
                                varName: promptVars.get(v),
                                options,
                                def: options[Math.max(0, di)].key,
                                targets: [{type: "read", sourceName: v, origName: promptVars.get(v), texts: Object.fromEntries(uniq.map((x, i) => ["o" + i, text(x.text)]))}],
                            });
                        }

                        const ruleList = (r) =>
                            (Array.isArray(r) ? r : [])
                                .filter(isPlain)
                                .map((x) => {
                                    const m =
                                        typeof x.promptId === "string" && x.promptId ? "id:" + x.promptId
                                        : typeof x.promptIdIncludes === "string" && x.promptIdIncludes ? "idin:" + x.promptIdIncludes
                                        : typeof x.nameIncludes === "string" && x.nameIncludes ? "name:" + x.nameIncludes
                                        : null;
                                    return m && typeof x.enabled === "boolean" ? {m, on: x.enabled} : null;
                                })
                                .filter(Boolean);
                        const schemes = [];
                        const walkRules = (v, origin) => {
                            if (Array.isArray(v)) {
                                v.forEach((x) => walkRules(x, origin));
                                return;
                            }
                            if (!isPlain(v)) return;
                            const name = typeof v.name === "string" ? v.name : "";
                            if (name && Array.isArray(v.modes)) {
                                const modes = v.modes.filter(isPlain).map((m, i) => ({key: String(m.id ?? i), label: String(m.label || m.id || i), rules: ruleList(m.rules)}));
                                if (modes.some((m) => m.rules.length)) schemes.push({name, origin, modes, def: String(v.defaultModeId ?? modes[0].key), model: v.modes.some((m) => isPlain(m) && m.modelPattern)});
                            } else if (name && (isPlain(v.on) || isPlain(v.off) || Array.isArray(v.rules))) {
                                const on = ruleList(isPlain(v.on) ? v.on.rules : v.rules),
                                    off = ruleList(isPlain(v.off) ? v.off.rules : []);
                                if (on.length || off.length)
                                    schemes.push({
                                        name,
                                        origin,
                                        modes: [
                                            {key: "on", label: "켜기", rules: on},
                                            {key: "off", label: "끄기", rules: off},
                                        ],
                                        def: v.defaultEnabled === false || v.defaultModeId === "off" ? "off" : "on",
                                    });
                            }
                            for (const x of Object.values(v)) if (x && typeof x === "object") walkRules(x, origin);
                        };
                        for (const l of literals) walkRules(l.value, "code");
                        walkRules(sc.data, "data");
                        const autoPair = (m) => {
                            const [type, v] = [m.slice(0, m.indexOf(":")), m.slice(m.indexOf(":") + 1)];
                            if (type === "id") return byIdent.has(v) ? [v] : [];
                            return toggles.filter((s) => (type === "idin" ? s.identifier : (s.origName ?? s.name)).includes(v)).map((s) => s.identifier);
                        };
                        for (const sch of schemes) {
                            const frags = [...new Set(sch.modes.flatMap((m) => m.rules.map((r) => r.m)))];
                            suggestions.push({
                                kind: "rules",
                                key: `r:${sch.origin}:${sch.name}`,
                                question: sch.name,
                                varName: "",
                                model: !!sch.model,
                                options: sch.modes.map((m) => ({key: m.key, label: m.label})),
                                def: sch.modes.some((m) => m.key === sch.def) ? sch.def : sch.modes[0].key,
                                rules: Object.fromEntries(sch.modes.map((m) => [m.key, m.rules])),
                                fragments: frags,
                                pairs: Object.fromEntries(frags.map((f) => [f, autoPair(f)])),
                            });
                        }

                        adaptHelperProfile(sc, raw, literals, suggestions, toggles, text, report);

                        const listed = new Set();
                        for (const l of literals) {
                            const walk = (v) => {
                                if (Array.isArray(v)) {
                                    const ids = v.filter((x) => typeof x === "string" && byIdent.has(x));
                                    if (ids.length >= 2) ids.forEach((x) => listed.add(x));
                                    v.forEach(walk);
                                    return;
                                }
                                if (!isPlain(v)) return;
                                const keys = Object.keys(v).filter((x) => byIdent.has(x));
                                if (keys.length >= 2)
                                    keys.forEach((x) => {
                                        listed.add(x);
                                        if (typeof v[x] === "string") listed.add(v[x]);
                                    });
                                Object.values(v).forEach(walk);
                            };
                            walk(l.value);
                        }
                        const lits = new Set(
                            T.filter((t) => t.t === "str")
                                .map((t) => t.v.trim())
                                .filter((v) => v && !listed.has(v)),
                        );
                        const exact = toggles.filter((s) => !slotted.has(s.identifier) && (lits.has((s.origName ?? s.name).trim()) || lits.has(s.identifier)));
                        const byKey = new Map();
                        for (const s of exact) {
                            const name = (s.origName ?? s.name).trim();
                            const cut = name.search(TOGGLE_SEP);
                            const key = s.groupId || (cut > 0 ? "p:" + name.slice(0, cut).trim() : "");
                            if (!byKey.has(key)) byKey.set(key, []);
                            byKey.get(key).push(s);
                        }
                        for (const group of byKey.values()) suggestions.push({kind: "toggle", key: "t:" + group.map((s) => s.identifier).join(","), ids: group.map((s) => s.id)});

                        const {data, ...rest} = sc;
                        return {...rest, flags, suggestions};
                    });

                    const loose = [...promptVars].filter(([convName, origName]) => !claimed.has(convName) && !promptSet.has(convName) && (Object.prototype.hasOwnProperty.call(presetVars, origName) || Object.prototype.hasOwnProperty.call(presetVars, convName)));
                    if (loose.length) {
                        result.push({
                            name: "(프리셋 변수)",
                            folder: "",
                            enabled: true,
                            synthetic: true,

                        if (run && run.catch) run.catch(() => {});

                        loadError = String((e && e.message) || e);
                    }
                    await new Promise((r) => setTimeout(r, 30));
                    if (typeof box.get !== "function") return {ok: false, error: "스크립트 코드를 읽지 못했습니다" + (loadError ? ": " + loadError : "")};
                    let decl = {};
                    try {
                        decl = box.get() || {};
                    } catch {}

                    const current = new Map(job.toggles.map((t) => [t.id, t.content]));
                    const ids = job.toggles.map((t) => t.id).filter((id) => id.length >= 3);
                    const extract = (res) => {
                        const map = new Map();
                        let nodes = 0;
                        const walk = (v, depth) => {
                            if (!v || typeof v !== "object" || depth > 6 || ++nodes > 20000) return;
                            if (Array.isArray(v)) {
                                for (const x of v) walk(x, depth + 1);
                                return;
                            }
                            let id = null;
                            for (const k of ["id", "identifier", "key"])
                                if (typeof v[k] === "string" && current.has(v[k])) {
                                    id = v[k];
                                    break;
                                }
                            if (id && typeof v.content === "string") {
                                if (!map.has(id)) map.set(id, {content: v.content, enabled: typeof v.enabled === "boolean" ? v.enabled : true});
                            } else {
                                const keys = Object.keys(v).filter((k) => current.has(k) && typeof v[k] === "string");
                                if (keys.length >= 2) for (const k of keys) if (!map.has(k)) map.set(k, {content: v[k], enabled: true});
                            }
                            for (const k of Object.keys(v)) {
                                const x = v[k];
                                if (x && typeof x === "object") walk(x, depth + 1);
                            }
                        };
                        walk(res, 0);
                        return map;
                    };
                    const cands = Object.entries(decl)
                        .filter(([, f]) => typeof f === "function" && f.length >= 1 && f.length <= 3)
                        .map(([name, f]) => {
                            let src = "";
                            try {
                                src = Function.prototype.toString.call(f);
                            } catch {}
                            return {name, f, score: ids.filter((id) => src.includes(id)).length, isAsync: /^async\b/.test(src)};
                        })
                        .filter((c) => !c.isAsync)
                        .sort((x, y) => y.score - x.score)
                        .slice(0, 80);
                    const found = [];
                    for (const cand of cands) {
                        for (const input of job.inputs) {
                            if (late()) break;
                            let res;
                            try {
                                res = cand.f(clone(input.value));
                            } catch {
                                continue;
                            }
                            if (res && typeof res.then === "function") {
                                res.then(
                                    () => {},
                                    () => {},
                                );
                                continue;
                            }
                            const map = extract(res);
                            let hits = 0;
                            for (const [id, v] of map) {
                                const c = current.get(id);
                                if (c && c.trim().length >= 20 && v.content === c) hits++;
                            }
                            if (hits >= 2) found.push({cand, input, map, hits});
                        }
                        if (late()) break;
                    }

                    const sameMap = (x, y) => x.size === y.size && [...x].every(([k, v]) => y.has(k) && y.get(k).content === v.content && y.get(k).enabled === v.enabled);
                    const responds = (c) =>
                        c.input.fields.some((f) =>
                            f.options.some((o, oi) => {
                                if (oi === f.saved) return false;
                                const s = clone(c.input.value);
                                let x = s;
                                for (let i = 0; i < f.path.length - 1; i++) x = x[f.path[i]];
                                x[f.path[f.path.length - 1]] = o.value;
                                try {
                                    return !sameMap(extract(c.cand.f(s)), c.map);
                                } catch {
                                    return false;
                                }
                            }),
                        );
                    found.sort((x, y) => y.hits - x.hits || y.map.size - x.map.size);
                    const best = found.find((c) => !late() && responds(c));
                    if (!best) return {ok: true, toggles: [], note: found.length ? "토글 내용을 만드는 부분은 찾았지만 설정에 따라 바뀌지 않습니다" : "설정에 따라 토글 내용을 만드는 부분을 찾지 못했습니다"};

                    const fn = best.cand.f,
                        input = best.input,
                        fields = input.fields;
                    const cache = new Map();
                    const stateOf = (assign) => {
                        const s = clone(input.value);
                        fields.forEach((f, fi) => {
                            let o = s;
                            for (let i = 0; i < f.path.length - 1; i++) o = o[f.path[i]];
                            o[f.path[f.path.length - 1]] = f.options[assign[fi]].value;
                        });
                        return s;
                    };
                    const runAt = (assign) => {
                        const key = assign.join(",");
                        if (!cache.has(key)) {
                            let m = null;
                            try {
                                m = extract(fn(stateOf(assign)));
                            } catch {}
                            cache.set(key, m);
                        }
                        return cache.get(key);
                    };
                    const cell = (assign, id) => {
                        const m = runAt(assign);
                        if (!m || !m.has(id)) return null;
                        const v = m.get(id);
                        const open = v.enabled !== false && v.content.trim() !== "";
                        return {content: open ? v.content : "", open};
                    };
                    const saved = fields.map((f) => f.saved);
                    const withF = (assign, fi, oi) => {
                        const a = assign.slice();
                        a[fi] = oi;
                        return a;
                    };
                    const cp = (x, y) => {
                        let i = 0;
                        const n = Math.min(x.length, y.length);
                        while (i < n && x[i] === y[i]) i++;
                        return i;
                    };
                    const cs = (x, y, max) => {
                        let i = 0;
                        while (i < max && x[x.length - 1 - i] === y[y.length - 1 - i]) i++;
                        return i;
                    };
                    const snap = (txt, start, end) => {
                        let i = txt.lastIndexOf("{{", start - 1);
                        if (i >= 0) {
                            const c = txt.indexOf("}}", i);
                            if (c === -1 || c + 2 > start) start = i;
                        }
                        i = txt.lastIndexOf("{{", end - 1);
                        if (i >= 0 && i < end) {
                            const c = txt.indexOf("}}", i);
                            if (c !== -1 && c + 2 > end) end = c + 2;
                        }
                        if (start > 0 && /[\uDC00-\uDFFF]/.test(txt[start])) start--;
                        if (end < txt.length && /[\uDC00-\uDFFF]/.test(txt[end])) end++;
                        return [start, end];
                    };
                    const product = (lists, cap) => {
                        let out = [[]];
                        for (const l of lists) {
                            const next = [];
                            for (const p of out) for (const x of l) next.push([...p, x]);
                            out = next;
                            if (out.length > cap) return null;
                        }
                        return out;
                    };

                    const toggles = [];
                    for (const t of job.toggles) {
                        if (late()) break;
                        const id = t.id;
                        const base0 = cell(saved, id);
                        if (!base0) continue;

                        let A1 = saved;
                        if (!base0.open) {
                            A1 = null;
                            for (let fi = 0; fi < fields.length && !A1; fi++)
                                for (let oi = 0; oi < fields[fi].options.length; oi++) {
                                    const a = withF(saved, fi, oi);
                                    const c = cell(a, id);
                                    if (c && c.open) {
                                        A1 = a;
                                        break;
                                    }
                                }
                            if (!A1) continue;
                        }
                        const base = cell(A1, id).content;
                        const gates = [],
                            regions = [],
                            openOpts = new Map();
                        fields.forEach((f, fi) => {
                            const opens = [],
                                closed = [];
                            let start = Infinity,
                                endTail = Infinity,
                                changes = false;
                            f.options.forEach((_, oi) => {
                                const c = cell(withF(A1, fi, oi), id);
                                if (!c || !c.open) {
                                    closed.push(oi);
                                    return;
                                }
                                opens.push(oi);
                                if (c.content === base) return;
                                changes = true;
                                const p = cp(base, c.content);
                                start = Math.min(start, p);
                                endTail = Math.min(endTail, cs(base, c.content, Math.min(base.length, c.content.length) - p));
                            });
                            openOpts.set(fi, opens);
                            if (closed.length && opens.length) gates.push({field: fi, open: opens});
                            if (changes) {
                                const [s, e] = snap(base, start, base.length - endTail);
                                regions.push({fields: [fi], start: s, end: e});
                            }
                        });
                        if (!regions.length && !gates.length) continue;

                        regions.sort((x, y) => x.start - y.start || x.end - y.end);
                        const groups = [];
                        for (const r of regions) {
                            const g = groups[groups.length - 1];
                            if (g && (r.start < g.end || (r.start === g.end && (r.start === r.end || g.start === g.end)))) {
                                g.fields.push(...r.fields);
                                g.end = Math.max(g.end, r.end);
                            } else groups.push({...r, fields: [...r.fields]});
                        }
                        let broken = false;
                        for (const g of groups) {
                            g.combos = product(
                                g.fields.map((fi) => openOpts.get(fi)),
                                400,
                            );
                            if (!g.combos) {
                                broken = true;
                                break;
                            }
                            g.texts = {};
                            const tail = base.length - g.end;
                            for (const combo of g.combos) {
                                let a = A1.slice();
                                g.fields.forEach((fi, i) => {
                                    a[fi] = combo[i];
                                });
                                const c = cell(a, id);
                                if (!c || !c.open) {
                                    g.texts[combo.join(",")] = "";
                                    continue;
                                }
                                const ok = c.content.length >= g.start + tail && c.content.slice(0, g.start) === base.slice(0, g.start) && c.content.slice(c.content.length - tail) === base.slice(g.end);
                                if (!ok) broken = true;
                                g.texts[combo.join(",")] = c.content.slice(g.start, c.content.length - tail);
                            }
                        }
                        if (broken) {
                            toggles.push({id, unsupported: true});
                            continue;
                        }

                        const touching = [...new Set([...groups.flatMap((g) => g.fields), ...gates.map((g) => g.field)])];
                        const textOf = (g, assign) => g.texts[g.fields.map((fi) => assign[fi]).join(",")] ?? "";
                        for (const g of groups) {
                            g.deps = {};
                            for (const fo of touching) {
                                if (g.fields.includes(fo) || late()) continue;
                                for (const q of openOpts.get(fo)) {
                                    if (q === A1[fo]) continue;
                                    const dA = withF(A1, fo, q);
                                    const D = cell(dA, id);
                                    if (!D || !D.open) continue;

                                    let head = g.start,
                                        tail = base.length - g.end;
                                    for (const h of groups) {
                                        if (h === g) continue;
                                        const delta = textOf(h, dA).length - textOf(h, A1).length;
                                        if (h.end <= g.start) head += delta;
                                        else tail += delta;
                                    }
                                    for (const combo of g.combos) {
                                        const a = dA.slice();
                                        g.fields.forEach((fi, i) => {
                                            a[fi] = combo[i];
                                        });
                                        const c = cell(a, id);
                                        if (!c || !c.open) continue;
                                        if (c.content.slice(0, head) !== D.content.slice(0, head) || c.content.slice(c.content.length - tail) !== D.content.slice(D.content.length - tail)) continue;
                                        const txt = c.content.slice(head, c.content.length - tail);
                                        const key = combo.join(",");
                                        if (txt === g.texts[key]) continue;
                                        const dep = g.deps[key] || (g.deps[key] = {field: fo, texts: {[A1[fo]]: g.texts[key]}});
                                        if (dep.field === fo) dep.texts[q] = txt;
                                    }
                                }
                            }
                            for (const [key, dep] of Object.entries(g.deps)) for (const q of openOpts.get(dep.field)) if (!(q in dep.texts)) dep.texts[q] = g.texts[key];
                        }

                        const parts = [];
                        let pos = 0;
                        for (const g of groups) {
                            if (g.start > pos) parts.push({t: "text", v: base.slice(pos, g.start)});
                            parts.push({t: "slot", fields: g.fields, combos: g.combos, texts: g.texts, deps: g.deps});
                            pos = g.end;
                        }
                        if (pos < base.length) parts.push({t: "text", v: base.slice(pos)});
                        const used = [...new Set([...touching, ...groups.flatMap((g) => Object.values(g.deps).map((d) => d.field))])].sort((x, y) => x - y);
                        const evalT = (assign) => {
                            for (const g of gates) if (!g.open.includes(assign[g.field])) return "";
                            let s = "";
                            for (const p of parts) {
                                if (p.t === "text") {
                                    s += p.v;
                                    continue;
                                }
                                const key = p.fields.map((fi) => assign[fi]).join(",");
                                const dep = p.deps[key];
                                s += dep ? (dep.texts[assign[dep.field]] ?? "") : (p.texts[key] ?? "");
                            }
                            return s;
                        };

                        const lists = used.map((fi) => fields[fi].options.map((_, oi) => oi));
                        let combos = product(lists, 3000);
                        const exhaustive = combos !== null;
                        if (!combos) {
                            combos = [];
                            let seed = 12345;
                            const rnd = (n) => {
                                seed = (seed * 1103515245 + 12345) & 0x7fffffff;
                                return seed % n;
                            };
                            for (let i = 0; i < 3000; i++) combos.push(lists.map((l) => l[rnd(l.length)]));
                        }
                        let checked = 0,
                            matched = 0;
                        for (const combo of combos) {
                            if (late()) break;
                            const a = saved.slice();
                            used.forEach((fi, i) => {
                                a[fi] = combo[i];
                            });
                            const c = cell(a, id);
                            if (!c) continue;
                            checked++;
                            if (evalT(a) === c.content) matched++;
                        }
                        toggles.push({id, parts, gates, fields: used, verify: {checked, matched, total: combos.length, exhaustive, complete: checked === combos.length}});
                    }
                    return {
                        ok: true,
                        fn: best.cand.name,
                        matchedToggles: best.hits,
                        timedOut: late(),
                        fields: fields.map((f) => ({path: f.path, key: f.key, question: f.question, options: f.options.map((o) => ({label: o.label})), saved: f.saved})),
                        toggles,
                    };
                }

                function applyRunnerResult(parsed, si, res) {
                    const sc = parsed.scripts[si];
                    if (!sc) return;
                    if (!res || !res.ok) {
                        sc.run = {state: "failed", error: (res && res.error) || "알 수 없는 오류"};
                        return;
                    }
                    const accepted = (t) => !t.unsupported && t.verify?.checked > 0 && t.verify.checked === t.verify.matched && t.verify.complete === true;
                    const good = (res.toggles || []).filter(accepted);
                    const rejected = (res.toggles || []).filter((t) => !accepted(t)).map((t) => t.id);
                    delete sc.computed;
                    sc.suggestions = sc.suggestions.filter((s) => s.kind !== "computed" && !(s.kind === "slot" && rejected.includes(s.identifier)));
                    if (!good.length) {
                        sc.run = {state: rejected.length ? "blocked" : "none", unsupported: rejected, note: res.note || (rejected.length ? "검증하지 못했거나 결과가 달라 원본 토글을 유지합니다." : "설정에 따라 바뀌는 토글이 없습니다")};
                        return;
                    }
                    const silent = makeConverter(makeReport(), "", parsed.converter.renames);
                    const cv = (t) => silent.convert(repairMacros(t, makeReport(), ""), "");
                    for (const tg of good) {
                        for (const p of tg.parts) {
                            if (p.t === "text") {
                                p.v = cv(p.v);
                                continue;
                            }
                            for (const k of Object.keys(p.texts)) p.texts[k] = cv(p.texts[k]);
                            for (const d of Object.values(p.deps)) for (const k of Object.keys(d.texts)) d.texts[k] = cv(d.texts[k]);
                        }
                    }
                    sc.computed = {fn: res.fn, fields: res.fields, toggles: good};
                    const unsupported = rejected;
                    sc.run = {state: "done", fn: res.fn, toggles: good.length, unsupported, timedOut: !!res.timedOut};
                    const ids = new Set(good.map((t) => t.id));
                    sc.suggestions = sc.suggestions.filter((sg) => !(sg.kind === "slot" && ids.has(sg.identifier)));
                    const used = [...new Set(good.flatMap((t) => t.fields))].sort((x, y) => x - y);
                    const made = used.map((fi) => {
                        const f = res.fields[fi];
                        const tgs = good.filter((t) => t.fields.includes(fi));
                        return {
                            kind: "computed",
                            key: "c:" + f.path.join("."),
                            field: f.path.join("."),
                            question: f.question,
                            varName: f.key.toLowerCase(),
                            options: f.options.map((o, i) => ({key: String(i), label: o.label})),
                            def: String(f.saved),
                            toggles: tgs.map((t) => t.id),
                            verify: {checked: tgs.reduce((n, t) => n + t.verify.checked, 0), matched: tgs.reduce((n, t) => n + t.verify.matched, 0), exhaustive: tgs.every((t) => t.verify.exhaustive)},
                            note: res.fields.some((f) => f.key === "STYLE_PROFILE") ? "세부 설정의 ‘자동’은 문체 추천값을 따릅니다. 직접 지정한 세부 값은 문체를 바꿔도 유지되며, 원본의 자동 초기화 동작은 옮기지 않습니다." : "",
                        };
                    });
                    sc.suggestions = [...made, ...sc.suggestions];
                }

                function renderComputed(tg, fields, vars) {
                    const v = (fi) => vars.get(fields[fi].path.join("."));
                    const label = (fi, oi) => {
                        const o = v(fi).options.find((x) => x.key === String(oi));
                        return (o ? o.label : fields[fi].options[oi].label).trim();
                    };
                    const is = (fi, oi) => `var:${v(fi).varName} == ${quote(label(fi, oi))}`;
                    const pick = (fi) => fields[fi].saved;
                    for (const g of tg.gates) if (!v(g.field) && !g.open.includes(pick(g.field))) return {content: "", enabled: false};
                    let body = "";
                    for (const p of tg.parts) {
                        if (p.t === "text") {
                            body += p.v;
                            continue;
                        }
                        for (const combo of p.combos) {
                            if (combo.some((oi, i) => !v(p.fields[i]) && oi !== pick(p.fields[i]))) continue;
                            const key = combo.join(",");
                            const dep = p.deps[key];
                            let text;
                            if (dep && v(dep.field))
                                text = Object.entries(dep.texts)
                                    .map(([q, t]) => (t ? `{{#if ${is(dep.field, q)}}}${t}{{/if}}` : ""))
                                    .join("");
                            else if (dep) text = dep.texts[pick(dep.field)] ?? "";
                            else text = p.texts[key] ?? "";
                            if (!text) continue;
                            const conds = combo.map((oi, i) => (v(p.fields[i]) ? is(p.fields[i], oi) : null)).filter(Boolean);
                            body += conds.length ? `{{#if ${conds.join(" && ")}}}${text}{{/if}}` : text;
                        }
                    }
                    const gateConds = tg.gates.filter((g) => v(g.field)).map((g) => "(" + g.open.map((oi) => is(g.field, oi)).join(" || ") + ")");
                    if (gateConds.length) body = `{{#if ${gateConds.join(" && ")}}}${body}{{/if}}`;
                    return {content: body, enabled: true};
                }

                function suggestionDone(sg, boundIds, valueVars) {
                    if (sg.kind === "toggle") return sg.ids.every((id) => boundIds.has(id));
                    return valueVars.some((v) => v.from === sg.key && (sg.kind !== "rules" || sg.fragments.every((f) => v.pairs?.[f]?.length)));
                }

                function normalizeValueVar(v) {
                    if (v && Array.isArray(v.options)) return v;
                    const values = Array.isArray(v && v.values) ? v.values : [];
                    const options = values.map((x, i) => ({key: "o" + i, label: x}));
                    return {
                        from: "v:" + v.sourceName,
                        script: v.script || "",
                        kind: "setting",
                        varName: v.varName,
                        question: v.question || v.varName,
                        options,
                        def: options[Math.max(0, values.indexOf(v.def))]?.key,
                        targets: [{type: "read", sourceName: v.sourceName, texts: Object.fromEntries(values.map((x, i) => ["o" + i, x]))}],
                    };
                }

                const REGEX_BOUND = 9999;
                const splitDelimited = (find) => {
                    const m = /^\/(.+)\/([dgimsuy]*)$/s.exec(find);
                    return m ? {source: m[1], wrap: (src) => `/${src}/${m[2]}`, flags: m[2] || "g"} : {source: find, wrap: (src) => src, flags: "g"};
                };
                const safetyProbe = (src) => src.replace(/\{\{[^}]*\}\}/g, "x");

                function boundBroadRepeats(src) {
                    let out = "",
                        i = 0;
                    while (i < src.length) {
                        let atom, broad;
                        if (src[i] === "\\") {
                            atom = src.slice(i, i + 2);
                            broad = /[sSwWdD]/.test(src[i + 1] || "");
                        } else if (src[i] === "[") {
                            const close = findCharClassClose(src, i);
                            if (close === -1) return src;
                            atom = src.slice(i, close + 1);
                            broad = isBroadCharacterClass(atom);
                        } else {
                            atom = src[i];
                            broad = atom === ".";
                        }
                        out += atom;
                        i += atom.length;
                        if (!broad) continue;
                        if (src[i] === "*") {
                            out += `{0,${REGEX_BOUND}}`;
                            i++;
                        } else if (src[i] === "+") {
                            out += `{1,${REGEX_BOUND}}`;
                            i++;
                        } else if (src[i] === "{") {
                            const m = /^\{(\d+),\}/.exec(src.slice(i));
                            if (m) {
                                out += `{${m[1]},${REGEX_BOUND}}`;
                                i += m[0].length;
                            }
                        }
                    }
                    return out;
                }

                function checkRegexSafety(find, report, where) {
                    if (typeof find !== "string" || !find) return {status: "ok"};
                    const {source, wrap, flags} = splitDelimited(find);
                    if (isPatternSafe(safetyProbe(source))) return {status: "ok"};
                    const bounded = boundBroadRepeats(source);
                    let compiles = true;
                    try {
                        new RegExp(bounded, flags);
                    } catch {
                        compiles = false;
                    }
                    if (compiles && bounded !== source && isPatternSafe(safetyProbe(bounded))) {
                        report.add("info", `마리나라 안전 검사에 걸리는 정규식이라, 끝없는 반복에 상한(${REGEX_BOUND}글자)을 붙여 통과하게 보정했습니다. 정규식 목록에서 보정을 끌 수 있습니다.`, where);
                        return {status: "fixed", patched: wrap(bounded)};
                    }

                async function listModels(cfg) {

                function systemPrompt(lang) {
                    return [`You translate the titles of toggles and regex scripts in a SillyTavern roleplay prompt preset into ${lang}.`, "The input is a JSON object of id → title. Reply with only a JSON object that has exactly the same keys, each mapped to the translated title.", "Rules:", "- Keep emoji, symbols, brackets, numbering, box-drawing or arrow characters, separators (: | - / ·) and their spacing exactly as they are. Translate only the words.", "- Keep {{macros}}, model names and common abbreviations (NSFW, CoT, POV, OOC, HTML, JB, etc.) as they are.", "- These are short UI labels: translate naturally and concisely. Do not add explanations.", `- If a title is already in ${lang} or has nothing to translate, return it unchanged.`].join("\n");

                function parseJsonObject(text) {
                    const t = text.replace(/^\s*```(?:json)?\s*/i, "").replace(/\s*```\s*$/, "");

                    if (a < 0 || b < a) throw new Error("번역 결과가 JSON 형식이 아닙니다.");
                    const obj = JSON.parse(t.slice(a, b + 1));
                    if (!obj || typeof obj !== "object" || Array.isArray(obj)) throw new Error("번역 결과가 JSON 객체가 아닙니다.");
                    return obj;
                }

                async function translateTitles(cfg, items, onProgress) {
                    const out = new Map();
                    const lang = (cfg.lang || "").trim() || "Korean (한국어)";
                    for (let i = 0; i < items.length; i += CHUNK) {
                        const chunk = items.slice(i, i + CHUNK);
                        const input = Object.fromEntries(chunk.map((it, k) => [String(k + 1), it.text]));
                        const reply = parseJsonObject(await complete(cfg, systemPrompt(lang), JSON.stringify(input, null, 1)));
                        chunk.forEach((it, k) => {
                            const v = reply[String(k + 1)];
                            if (typeof v === "string" && v.trim()) out.set(it.key, v.trim());
                        });
                        if (onProgress) onProgress(Math.min(i + CHUNK, items.length), items.length);
                    }
                    return out;
                }

                async function suggestVarNames(cfg, names, onProgress) {
                    const system = ["You name variables used in macros of a SillyTavern roleplay prompt preset.", "The input is a JSON object of id → original variable name (often Chinese, Japanese or Korean). Reply with only a JSON object that has exactly the same keys, each mapped to an English variable name.", "Rules:", "- Use lower snake_case: ASCII letters, digits and underscores only, starting with a letter.", "- Translate the meaning into a short, descriptive name (1–4 words), e.g. 好感度 → affection, 天气 → weather.", "- Give different originals different names. Do not add explanations."].join("\n");
                    const out = new Map();
                    for (let i = 0; i < names.length; i += CHUNK) {
                        const chunk = names.slice(i, i + CHUNK);
                        const input = Object.fromEntries(chunk.map((n, k) => [String(k + 1), n]));
                        const reply = parseJsonObject(await complete(cfg, system, JSON.stringify(input, null, 1)));
                        chunk.forEach((n, k) => {
                            const v = String(reply[String(k + 1)] ?? "")
                                .trim()
                                .toLowerCase()
                                .replace(/[\s-]+/g, "_")
                                .replace(/[^a-z0-9_]/g, "")
                                .replace(/^[^a-z]+/, "");
                            if (v) out.set(n, v);
                        });
                        if (onProgress) onProgress(Math.min(i + CHUNK, names.length), names.length);
                    }
                    return out;
                }

                function needsTranslation(text, includeHangul) {
                    if (!text || !text.trim()) return false;
                    if (!includeHangul && /\p{Script=Hangul}/u.test(text)) return false;
                    return /[A-Za-z]{2,}|\p{Script=Han}|\p{Script=Hiragana}|\p{Script=Katakana}/u.test(text);

                    if (btn && btn.dataset.sedit) return openSection(btn.dataset.sedit);
                    if (btn && btn.dataset.remove) return removeSections([btn.dataset.remove]);
                    if (btn && btn.dataset.restore) {
                        removed.delete(btn.dataset.restore);
                        renderList();
                        updateBadge();
                        return scheduleSave();
                    }
                    const bundle = e.target.closest(".bundle");
                    if (bundle) {
                        const n = bundle.dataset.bundle;
                        openBundles.has(n) ? openBundles.delete(n) : openBundles.add(n);
                        return renderList();
                    }
                    const grp = e.target.closest(".grp");
                    if (grp) {
                        const members = visibleSections().filter((s) => s.groupId === grp.dataset.group && selectable(s));
                        const all = members.every((s) => selected.has(s.id));
                        members.forEach((s) => (all ? selected.delete(s.id) : selected.add(s.id)));

                    if (suppressClick) {
                        suppressClick = false;
                        return;
                    }

                    pick(id, !selected.has(id), e.shiftKey);
                });
                $("list").addEventListener("mousedown", (e) => {
                    if (e.shiftKey) e.preventDefault();
                });

                function pick(id, target, range) {
                    const vis = visibleSections()
                        .filter(selectable)
                        .map((s) => s.id);
                    if (range && lastClicked && vis.includes(lastClicked)) {
                        const [a, b] = [vis.indexOf(lastClicked), vis.indexOf(id)].sort((x, y) => x - y);
                        vis.slice(a, b + 1).forEach((x) => (target ? selected.add(x) : selected.delete(x)));
                    } else {
                        target ? selected.add(id) : selected.delete(id);
                    }
                    lastClicked = id;
                    selectionChanged();
                }

                let pressTimer = null,
                    pressStart = null,
                    suppressClick = false;
                $("list").addEventListener("pointerdown", (e) => {
                    if (e.pointerType === "mouse") return;
                    suppressClick = false;
                    const row = e.target.closest(".row");
                    if (!row || row.classList.contains("off") || e.target.closest("button")) return;
                    pressStart = {x: e.clientX, y: e.clientY};
                    pressTimer = setTimeout(() => {
                        pressTimer = null;
                        suppressClick = true;
                        if (navigator.vibrate) navigator.vibrate(15);
                        pick(row.dataset.id, true, true);
                    }, 450);
                });
                const cancelPress = () => {
                    clearTimeout(pressTimer);
                    pressTimer = null;

                ["pointerup", "pointercancel", "scroll"].forEach((ev) => $("list").addEventListener(ev, cancelPress));
                $("list").addEventListener("contextmenu", (e) => {

                const listOpen = () => document.body.classList.contains("list-open");

                    const n = selected.size;

                    document.body.classList.remove("list-open");

                $("backdrop").addEventListener("click", closeList);

                function selectionChanged() {
                    syncEditor();
                    renderList();

                    scheduleSave();
                }

                function syncEditor() {
                    const map = byId();
                    const index = new Map(parsed.sections.map((s, i) => [s.id, i]));
                    const kept = ed.order.filter((id) => selected.has(id));
                    const added = [...selected].filter((id) => !kept.includes(id)).sort((a, b) => index.get(a) - index.get(b));
                    ed.order = kept.concat(added);
                    for (const id of [...ed.defaults]) if (!selected.has(id)) ed.defaults.delete(id);
                    for (const id of added) {
                        if (!map.get(id).enabled) continue;
                        if (ed.pick === "single" && ed.order.length > 1 && (ed.defaults.size || ed.noneDefault)) continue;
                        ed.defaults.add(id);
                    }

                    const names = ed.order.map((id) => map.get(id).name || "");
                    const {prefix, rest} = Converter.splitCommonPrefix(names);
                    const fallback = ed.order.length === 1 ? names[0] : "";
                    if (!ed.varName.trim() || ed.varName === ed.autoName) ed.varName = ed.autoName = suggestVarName(prefix || fallback);
                    if (!ed.touched.question) ed.question = prefix || fallback;
                    if (!ed.touched.sectionName) ed.sectionName = prefix || fallback;
                    ed.order.forEach((id, i) => {
                        if (!ed.touched.labels.has(id)) ed.labels[id] = rest[i] || names[i];
                    });
                }

                // a real, valid name up front, so "변수 만들기" works without typing; edits stick
                function suggestVarName(label) {
                    const taken = new Set([...variables.filter((_, i) => i !== editing).map((v) => v.varName.toLowerCase()), ...valueVars.map((v) => v.varName.toLowerCase())]);
                    const raw = String(label || "")
                        .replace(/[^A-Za-z0-9_]+/g, "_")
                        .replace(/^_+|_+$/g, "")
                        .toLowerCase();
                    let base = /^[a-z_]/.test(raw) && raw.length <= 20 ? raw : "choice";
                    if (Converter.isReservedName(base)) base += "_opt";
                    const full = (n) => (varPrefix && !n.startsWith(varPrefix) ? varPrefix + n : n).toLowerCase();
                    let k = 1,
                        name = base === "choice" ? "choice1" : base;
                    while (taken.has(full(name))) name = base + ++k;
                    return name;
                }
                // 다시 그리는 중에 포커스된 입력칸이 지워지면 focusout이 다시 렌더를 부르지 않도록 막음
                var edRendering = false;
                function renderEditor() {
                    if (edRendering) return;
                    edRendering = true;
                    try {
                        return renderEditorInner();
                    } finally {
                        edRendering = false;
                    }
                }
                function renderEditorInner() {

                        if (editing !== null) box.innerHTML += `<div class="ed-foot" style="padding:0 14px 14px"><button data-act="cancel">편집 취소</button></div>`;

                    const isBool = ed.order.length === 1;
                    const multi = !isBool && ed.pick !== "single";

        <button class="ghost icon optact" data-act="down" data-i="${i}" title="아래로" ${i === ed.order.length - 1 ? "disabled" : ""}>↓</button>
        <button class="ghost icon optact" data-act="remove" data-id="${id}" title="빼기">✕</button>
      </div>${ed.preview.has(id) ? `<div class="opt-preview"><pre>${esc(s.content || "(비어 있음)")}</pre></div>` : ""}`;
                        })
                        .join("");
                    const noneRow = !isBool && !multi && ed.addNone ? `<div class="opt"><input type="radio" name="def" data-def="__none" ${ed.noneDefault ? "checked" : ""} title="기본값"><span style="flex:1;color:var(--muted)">없음 (아무것도 안 넣기)</span></div>` : "";
