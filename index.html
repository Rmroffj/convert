                    const cond = conditionField(map);
                    const advSummary = [ed.mode === "A" ? "내용 옮기기 · " + (ed.into ? (map.get(ed.into)?.name || "섹션") + "에 넣기" : "새 섹션") : "#if로 감싸기", ed.when ? "조건 있음" : ""].filter(Boolean).join(" · ");

                    box.innerHTML = `<div class="editor">
      <div class="ed-title">
        <b>${editing !== null ? `변수 편집: {{${esc(variables[editing].varName)}}}` : `새 변수 · 토글 ${ed.order.length}개`}</b>
        ${isBool ? "" : seg("pick", [
            ["single", "하나만"],
            ["multi", "여러 개"],
            ["random", "랜덤 1개", "고른 것 중 하나를 매번 랜덤으로"],
        ])}
      </div>
      <div class="grid2">
        <div class="fld"><span>변수 이름 (영문·숫자·_)</span>
          <div class="affix"><input type="text" data-prefix value="${esc(varPrefix)}" placeholder="앞부분" aria-label="공통 앞부분" title="모든 변수 이름 앞에 붙는 공통 앞부분 (예: a_). 다음에도 기억됩니다"><input type="text" data-field="varName" value="${esc(ed.varName)}" aria-label="변수 이름" spellcheck="false" autocomplete="off"></div>
          <div class="hint" data-final>${finalNameHint()}</div></div>
        <label class="fld"><span>선택 창 제목</span><input type="text" data-field="question" value="${esc(ed.question)}" placeholder="예: 문체를 고르세요"></label>
      </div>
      <div class="fld"><span>사용자에게 보이는 모습 · ${isBool ? "체크하면 기본으로 켜짐" : multi ? "체크한 것이 기본으로 켜짐" : "동그라미가 기본값"} · 이름을 눌러 고치기</span>
        <div class="opts"><div class="opts-head"><b data-qview>${esc(ed.question)}</b><span class="hint">${pickLabel}</span></div>${optRows}${noneRow}</div></div>
      ${!isBool && !multi ? `<label class="hint" style="display:flex;gap:5px;align-items:center;cursor:pointer;align-self:flex-start"><input type="checkbox" data-field="addNone" ${ed.addNone ? "checked" : ""}> '없음' 선택지도 넣기</label>` : ""}
      <button class="adv-t" data-act="adv" aria-expanded="${advOpen}">넣는 방식 · 위치${cond ? " · 조건" : ""} <span class="hint">${esc(advSummary)}</span></button>
      ${
          advOpen ?
              `<div class="adv">
        <div class="modes">
          <button data-seg="mode" data-val="A" class="${ed.mode === "A" ? "on" : ""}">내용 옮기기<span>옵션 글을 변수 하나에 모아 한 섹션에 넣습니다. 보통 이쪽입니다.</span></button>
          <button data-seg="mode" data-val="B" class="${ed.mode === "B" ? "on" : ""}">#if로 감싸기<span>원래 섹션은 그대로 두고 각각 조건문으로 감쌉니다.</span></button>
        </div>
        ${ed.mode === "A" ? placementFields(map) : ""}
        ${cond}
        ${ed.mode === "A" && multi && ed.pick === "multi" ? `<label class="fld" style="display:flex;gap:6px;align-items:center"><span style="margin:0">옵션 사이 구분자</span><input type="text" data-field="separator" value="${esc(encSep(ed.separator))}" style="width:90px" title="옵션 사이에 들어갈 글자 (\\n = 줄바꿈)"></label>` : ""}
      </div>`
          :   ""
      }
      <div class="ed-foot">
        <span class="err ${ed.error ? "" : "hidden"}">${esc(ed.error)}</span>
        <button data-act="cancel">${editing !== null ? "편집 취소" : "선택 해제"}</button>
        <button class="primary" data-act="save">${editing !== null ? "저장" : "변수 만들기"}</button>
      </div>
    </div>`;
                }

                function condTargets(map) {
                    const self = fullVarName();
                    const out = [];
                    variables.forEach((v, i) => {
                        if (i === editing || v.varName === self) return;
                        const labels = Converter.uniqueLabels(v.sectionIds.map((id, k) => (v.labels && v.labels[k]) || map.get(id)?.name));
                        if (v.sectionIds.length > 1 && v.pick === "single" && v.addNone) labels.push("없음");
                        out.push([v.varName, labels]);
                    });
                    for (const v of valueVars) if (v.varName !== self) out.push([v.varName, v.options.map((o) => o.label)]);
                    return out;
                }
                function conditionField(map) {
                    const targets = condTargets(map);
                    if (!targets.length && !ed.when) return "";
                    const cur = targets.find(([n]) => n === ed.when?.varName);
                    const opt = (v, l, on) => `<option value="${esc(v)}" ${on ? "selected" : ""}>${esc(l)}</option>`;
                    return `<div class="fld"><span>조건</span><div class="cond-row">
      <select data-when-var>${opt("", "없음", !ed.when)}${targets.map(([n]) => opt(n, "{{" + n + "}}", n === ed.when?.varName)).join("")}${ed.when && !cur ? opt(ed.when.varName, "{{" + ed.when.varName + "}}", true) : ""}</select>
      ${ed.when ? `<span>=</span><select data-when-label>${(cur ? cur[1] : [ed.when.label]).map((l) => opt(l, l, l === ed.when.label)).join("")}</select>` : ""}</div></div>`;
                }
                function condLabel(v) {
                    if (!v.when?.varName) return "";
                    const t = condTargets(byId()).find(([n]) => n === v.when.varName);
                    return t && t[1].includes(v.when.label) ? ` · ${esc(v.when.varName)} = ${esc(v.when.label)}` : ` <span class="chip warn">조건 끊김</span>`;
                }

                const hostContent = (id) => (contentEdits.has(id) ? contentEdits.get(id) : (byId().get(id)?.content ?? ""));
                const ANCHOR_LEN = 40;
                function placementFields(map) {
                    const hosts = parsed.sections.filter((s) => !s.isMarker && !removed.has(s.id) && !ed.order.includes(s.id));
                    if (ed.into && !hosts.some((s) => s.id === ed.into)) ed.into = "";
                    const labels = hostLabels(hosts);
                    const select = `<div class="fld"><span>넣을 곳</span><div class="combo"><input type="text" data-into value="${esc(ed.into ? labels.get(ed.into) : "")}" placeholder="새 섹션" autocomplete="off" spellcheck="false">
      <div class="combo-list hidden"></div></div></div>`;
                    if (!ed.into) return `<div class="grid2">${select}<label class="fld"><span>섹션 이름</span><input type="text" data-field="sectionName" value="${esc(ed.sectionName)}" placeholder="비우면 변수 이름"></label></div>`;
                    const seg = `<div class="seg">${[
                        ["end", "맨 아래"],
                        ["pos", "직접 위치"],
                    ]
                        .map(([v, l]) => `<button data-seg="at" data-val="${v}" class="${ed.at === v ? "on" : ""}">${l}</button>`)
                        .join("")}</div>`;
                    const content = hostContent(ed.into);
                    const marked = ed.pos === null ? "" : `<pre class="pos-mark">${esc(content.slice(Math.max(0, ed.pos - ANCHOR_LEN), ed.pos))}<mark>{{${esc(fullVarName() || "var")}}}</mark>${esc(content.slice(ed.pos, ed.pos + ANCHOR_LEN))}</pre>`;
                    return `<div class="grid2">${select}<div class="fld"><span>위치</span>${seg}</div></div>
      ${ed.at === "pos" ? `<textarea data-pos readonly rows="8" spellcheck="false">${esc(content)}</textarea>${marked}` : ""}`;
                }

                function hostLabels(hosts) {
                    const seen = new Map(),
                        out = new Map();
                    for (const s of hosts) {
                        const base = s.name || "(이름 없음)",
                            n = (seen.get(base) || 0) + 1;
                        seen.set(base, n);
                        out.set(s.id, n > 1 ? `${base} #${n}` : base);
                    }
                    return out;
                }
                const hostList = () => [...hostLabels(parsed.sections.filter((s) => !s.isMarker && !removed.has(s.id) && !ed.order.includes(s.id)))];
                function chooseInto(id) {
                    if (id !== ed.into) {
                        ed.into = id;
                        ed.pos = null;
                        ed.anchor = "";
                    }
                    renderEditor();
                }

                function setInto(t) {
                    const v = t.value.trim();
                    const id = v ? hostList().find(([, l]) => l === v)?.[0] : "";
                    if (id !== undefined && id !== ed.into) return chooseInto(id);
                    t.value = ed.into ? (new Map(hostList()).get(ed.into) ?? "") : "";
                    t.parentElement.querySelector(".combo-list").classList.add("hidden");
                }

                let comboActive = 0;
                function comboShow(t, filter) {
                    const q = filter ? t.value.trim().toLowerCase() : "";
                    const items = [["", "새 섹션"], ...hostList().filter(([, l]) => !q || l.toLowerCase().includes(q))];
                    comboActive = Math.min(comboActive, items.length - 1);
                    const list = t.parentElement.querySelector(".combo-list");
                    list.innerHTML = items.map(([id, l], i) => `<div class="combo-item ${id ? "" : "new"} ${i === comboActive ? "on" : ""} ${id === ed.into ? "cur" : ""}" data-pick="${id}">${esc(l)}</div>`).join("");
                    list.classList.remove("hidden");
                    list.querySelector(".on")?.scrollIntoView({block: "nearest"});
                }
                $("editor").addEventListener("focusin", (e) => {
                    if (e.target.dataset.into !== undefined) {
                        comboActive = 0;
                        e.target.select();
                        comboShow(e.target, false);
                    }
                });
                $("editor").addEventListener("focusout", (e) => {
                    if (e.target.dataset.into !== undefined && e.target.isConnected && !edRendering) setInto(e.target);
                });
                $("editor").addEventListener("mousedown", (e) => {
                    const it = e.target.closest(".combo-item");
                    if (it) {
                        e.preventDefault();
                        chooseInto(it.dataset.pick);
                    }
                });
                $("editor").addEventListener("keydown", (e) => {
                    const t = e.target;
                    if (t.dataset.into === undefined) return;
                    const items = t.parentElement.querySelectorAll(".combo-item");
                    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
                        e.preventDefault();
                        comboActive = (comboActive + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length;
                        items.forEach((x, i) => x.classList.toggle("on", i === comboActive));
                        items[comboActive]?.scrollIntoView({block: "nearest"});
                    } else if (e.key === "Enter") {
                        e.preventDefault();
                        if (items[comboActive]) chooseInto(items[comboActive].dataset.pick);
                    } else if (e.key === "Escape") {
                        e.preventDefault();
                        renderEditor();
                    }
                });
                function pickPos(t) {
                    const content = hostContent(ed.into);
                    ed.pos = Math.min(t.selectionStart, content.length);
                    ed.anchor = content.slice(Math.max(0, ed.pos - ANCHOR_LEN), ed.pos);
                    const box = $("editor").querySelector(".pos-mark");
                    const html = `${esc(ed.anchor)}<mark>{{${esc(fullVarName() || "var")}}}</mark>${esc(content.slice(ed.pos, ed.pos + ANCHOR_LEN))}`;
                    if (box) box.innerHTML = html;
                    else t.insertAdjacentHTML("afterend", `<pre class="pos-mark">${html}</pre>`);
                }
                for (const ev of ["click", "keyup", "select"])
                    $("editor").addEventListener(ev, (e) => {
                        if (e.target.dataset?.pos !== undefined) pickPos(e.target);
                    });

                const PREFIX_KEY = "var-prefix";
                let varPrefix = "";
                try {
                    varPrefix = localStorage.getItem(PREFIX_KEY) || "";
                } catch {}
                function fullVarName() {
                    const base = ed.varName.trim();
                    return base && varPrefix && !base.startsWith(varPrefix) ? varPrefix + base : base;
                }
                function finalNameHint() {
                    return varPrefix && ed.varName.trim() ? `최종 이름: <code>{{${esc(fullVarName())}}}</code>` : "";
                }

                $("editor").addEventListener("input", (e) => {

                const MARK_ON = "",

        </div>
        <label class="fld"><span>${p.kind === "vertex" ? "API 키 또는 서비스 계정 JSON" : "API 키"}</span>
          ${p.kind === "vertex" ? `<textarea data-trc="key" rows="3" spellcheck="false" autocomplete="off">${esc(c.key)}</textarea>` : `<input type="password" data-trc="key" value="${esc(c.key)}" autocomplete="off" spellcheck="false">`}</label>
        ${
            p.kind === "vertex" ?
                `<div class="grid2">
          <label class="fld"><span>프로젝트 ID</span><input type="text" data-trc="project" value="${esc(c.project)}" placeholder="서비스 계정 JSON이면 비워도 됨"></label>
          <label class="fld"><span>리전</span><input type="text" data-trc="location" value="${esc(c.location)}" placeholder="global"></label></div>
          <div class="hint">API 키만 넣고 프로젝트를 비우면 Vertex Express 모드로 부릅니다. 서비스 계정 JSON은 이 브라우저 안에서 서명해 토큰을 받습니다.</div>`
            :   `<label class="fld"><span>API 주소 (Base URL)${tr.provider === "custom" ? "" : " · 비우면 기본값"}</span><input type="text" data-trc="base" value="${esc(c.base)}" placeholder="${esc(p.base || "https://…/v1")}"></label>`
        }
        <div class="tr-inline">
          <label class="hint tr-check"><input type="checkbox" data-tr="remember" ${tr.remember ? "checked" : ""}> 키를 이 브라우저에 저장</label>
          <button data-tract="test" ${trBusy ? "disabled" : ""} style="margin-left:auto">연결 테스트</button>
        </div>
        <div class="hint">키는 이 브라우저에만 저장되고, 고른 프로바이더로만 바로 보냅니다.</div>
      </div>
      <div class="tr-sec"><div class="tr-title">번역</div>
        <div class="grid2">
          <label class="fld"><span>번역할 언어</span><input type="text" data-tr="lang" value="${esc(tr.lang)}" placeholder="한국어"></label>
          <label class="hint tr-check" style="align-self:end;padding-bottom:7px"><input type="checkbox" data-tr="includeHangul" ${tr.includeHangul ? "checked" : ""}> 한글이 섞인 제목도 번역</label>
        </div>
        <div class="tr-inline">
          <button class="primary" data-tract="run" ${!parsed || !n || trBusy ? "disabled" : ""}>${parsed ? `제목 ${n}개 번역하기` : "프리셋을 먼저 여세요"}</button>
          ${status}
        </div>
        <div class="hint">변수를 만들기 전에 번역하면 옵션 이름과 질문에도 번역된 제목이 쓰입니다.</div>
      </div>
      ${
          rows ?
              `<div class="tr-sec"><div class="tr-inline"><div class="tr-title" style="margin:0">번역 결과 ${titles.size}개</div>
          <span style="margin-left:auto"></span>
          <button class="ghost" data-tract="allon">모두 적용</button><button class="ghost" data-tract="alloff">모두 원래대로</button><button class="ghost" data-tract="clear">지우기</button></div>
        <div class="tr-list">${rows}</div></div>`
          :   ""
      }`;
                }

                async function trRun(act) {
                    trBusy = true;
                    trStatus = {
                        text:
                            act === "test" ? "연결하는 중…"
                            : act === "models" ? "모델 목록을 불러오는 중…"
                            : "번역하는 중…",
                    };
                    renderTr();
                    try {
                        if (act === "test") {
                            const reply = await Translator.complete(trCfg(), 'Reply with a JSON object {"ok": true}.', "ping");
                            trStatus = {text: "연결됨 · 응답: " + reply.trim().slice(0, 60)};
                        } else if (act === "models") {
                            trModels = await Translator.listModels(trCfg());
                            trStatus = {text: `모델 ${trModels.length}개를 불러왔습니다. 모델 칸을 눌러 고르세요.`};
                        } else {
                            const items = titleCandidates();
                            const byText = new Map();
                            for (const it of items) {
                                if (!byText.has(it.text)) byText.set(it.text, []);
                                byText.get(it.text).push(it.key);
                            }
                            const unique = [...byText.keys()].map((text, i) => ({key: String(i), text}));
                            const res = await Translator.translateTitles(trCfg(), unique, (done, total) => {
                                trStatus = {text: `번역하는 중… ${done}/${total}`};
                                const s = $("trBody").querySelector(".tr-sec:nth-child(2) .tr-inline span");
                                if (s) s.textContent = trStatus.text;
                            });
                            let got = 0;
                            unique.forEach((u) => {
                                const text = res.get(u.key);
                                if (!text) return;
                                got++;
                                for (const key of byText.get(u.text)) titles.set(key, {text, on: true});
                            });
                            trStatus = {text: got === unique.length ? `${got}개를 번역해서 적용했습니다.` : `${unique.length}개 중 ${got}개만 번역됐습니다. 다시 눌러 나머지를 시도할 수 있습니다.`, err: got < unique.length};
                            trBusy = false;
                            return titlesChanged();
                        }
                    } catch (e) {
                        trStatus = {text: e.message, err: true};
                    }
                    trBusy = false;
                    renderTr();
                }

                function renameVars(next) {
                    const before = new Map(parsed.varRenames);
                    const snap = snapshot();
                    const after = new Map(Converter.parsePreset(JSON.parse(source.text), source.name, {varNames: next}).varRenames);
                    const map = new Map([...before].filter(([o, cur]) => after.has(o) && after.get(o) !== cur).map(([o, cur]) => [cur, after.get(o)]));
                    snap.varNames = [...next];
                    if (map.size) {
                        const inMacro = new RegExp(`(?<=\\{\\{[^{}]*?)(?<![\\w.-])(?:${[...map.keys()].map((k) => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|")})(?![\\w.-])`, "g");
                        const fix = (v, key) => {
                            if (typeof v === "string") {
                                if ((key === "sourceName" || key === "varName") && map.has(v)) return map.get(v);
                                if (key === "from" && v.startsWith("v:") && map.has(v.slice(2))) return "v:" + map.get(v.slice(2));
                                return v.replace(inMacro, (m) => map.get(m));
                            }
                            if (Array.isArray(v)) return v.map((x) => fix(x, key));
                            if (v && typeof v === "object") return Object.fromEntries(Object.entries(v).map(([k, x]) => [k, fix(x, k)]));
                            return v;
                        };
                        for (const k of ["variables", "valueVars", "contentEdits", "ed"]) snap[k] = fix(snap[k], k);
                    }
                    restore(snap);
                    showTab("macro");
                }
                let vnBusy = false,
                    vnStatus = null;
                async function suggestVarNames() {
                    if (!conn().key.trim()) {
                        vnStatus = {text: "API 미설정", err: true};
                        return renderMacro();
                    }
                    vnBusy = true;
                    vnStatus = {text: "…"};
                    renderMacro();
                    try {
                        const origs = parsed.varRenames.map(([o]) => o);
                        const res = await Translator.suggestVarNames(trCfg(), origs, (done, total) => {
                            const s = $("vnStatus");
                            if (s) s.textContent = `${done}/${total}`;
                        });
                        vnStatus = res.size === origs.length ? null : {text: `${res.size}/${origs.length}`, err: true};
                        vnBusy = false;
                        return renameVars(new Map([...varNames, ...res]));
                    } catch (e) {
                        vnStatus = {text: e.message, err: true};
                    }
                    vnBusy = false;
                    renderMacro();
                }
                $("tab-macro").addEventListener("change", (e) => {
                    const t = e.target;
                    if (t.dataset.vnFrom === undefined) return;
                    const next = new Map(varNames);
                    const v = t.value.trim();
                    if (v === new Map(parsed.varRenames).get(t.dataset.vnFrom)) return;
                    if (v) next.set(t.dataset.vnFrom, v);
                    else next.delete(t.dataset.vnFrom);
                    renameVars(next);
                });
                $("tab-macro").addEventListener("click", (e) => {
                    const b = e.target.closest("button[data-vnact]");
                    if (!b || vnBusy) return;
                    if (b.dataset.vnact === "api") suggestVarNames();
                    if (b.dataset.vnact === "reset" && confirm("되돌릴까요?")) {
                        vnStatus = null;
                        renameVars(new Map());
                    }
                });

                $("trBtn").addEventListener("click", () => {
                    renderTr();
                    $("trDialog").showModal();
                });
                $("trClose").addEventListener("click", () => $("trDialog").close());
                $("trDialog").addEventListener("click", (e) => {
                    if (e.target === $("trDialog")) $("trDialog").close();
                });
                $("trBody").addEventListener("input", (e) => {
                    const t = e.target;
                    if (t.dataset.trc) {
                        conn()[t.dataset.trc] = t.value;
                        saveTr();
                    } else if (t.dataset.tr === "lang") {
                        tr.lang = t.value;
                        saveTr();
                    } else if (t.dataset.trtext) {
                        titles.get(t.dataset.trtext).text = t.value;
                        applyTitles();
                        if (ed.order.length) syncEditor();
                        renderAll();
                    }
                });
                $("trBody").addEventListener("change", (e) => {
                    const t = e.target;
                    if (t.dataset.tr === "provider") {
                        tr.provider = t.value;
                        trModels = [];
                        trStatus = null;
                        saveTr();
                        return renderTr();
                    }
                    if (t.dataset.tr === "remember" || t.dataset.tr === "includeHangul") {
                        tr[t.dataset.tr] = t.checked;
                        saveTr();
                        return renderTr();
                    }
                    if (t.dataset.tron) {
                        titles.get(t.dataset.tron).on = t.checked;
                        return titlesChanged();
                    }
                });
                $("trBody").addEventListener("click", (e) => {
                    const b = e.target.closest("button[data-tract]");
                    if (!b) return;
                    const act = b.dataset.tract;
                    if (act === "test" || act === "models" || act === "run") return trRun(act);
                    if (act === "allon" || act === "alloff") {
                        for (const t of titles.values()) t.on = act === "allon";
                        return titlesChanged();
                    }
                    if (act === "clear" && confirm("번역 결과를 모두 지우고 원래 제목으로 돌릴까요?")) {
                        titles.clear();
                        trStatus = null;
                        return titlesChanged();
                    }
                });

                function renderAll() {
                    renderList();
                    renderEditor();
                    renderVars();
                    updateBadge();
                    renderRegexBar();
                    renderScriptBar();
                    scheduleSave();
                }
            })();
        </script>
    </body>
</html>
